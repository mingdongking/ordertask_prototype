function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(clampToViewport) : null;
    if (ro) { ro.observe(document.documentElement); return () => ro.disconnect(); }
    window.addEventListener('resize', clampToViewport);
    return () => window.removeEventListener('resize', clampToViewport);
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) };
      clampToViewport();
    };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  return (
    <>
      {/* Floating toggle button */}
      <button
        onClick={() => setOpen(o => !o)}
        style={{
          position: 'fixed', right: 16, bottom: open ? 'auto' : 16,
          top: open ? 16 : 'auto',
          zIndex: 2147483647,
          width: 36, height: 36, borderRadius: '50%',
          background: 'rgba(0,47,108,0.85)', color: '#fff',
          border: 'none', cursor: 'pointer', fontSize: 16,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          boxShadow: '0 2px 8px rgba(0,0,0,0.25)',
        }}
        title={open ? '패널 닫기' : '설정 열기'}
      >⚙</button>

      {open && (
        <>
          <style>{__TWEAKS_STYLE}</style>
          <div ref={dragRef} className="twk-panel"
            style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
            <div className="twk-hd" onMouseDown={onDragStart}>
              <b>{title}</b>
              <button className="twk-x" aria-label="Close tweaks"
                onMouseDown={(e) => e.stopPropagation()}
                onClick={dismiss}>✕</button>
            </div>
            <div className="twk-body">{children}</div>
          </div>
        </>
      )}
    </>
  );
}

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
        value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
        role="switch" aria-checked={!!value}
        onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value);
  valueRef.current = value;
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
      onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;
  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };
  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => { const v = segAt(ev.clientX); if (v !== valueRef.current) onChange(v); };
    const up = () => { setDragging(false); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
        className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
          style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>{o.label}</button>
        ))}
      </div>
    </TweakRow>
  );
}

Object.assign(window, { useTweaks, TweaksPanel, TweakSection, TweakRow, TweakSlider, TweakToggle, TweakRadio, TweakSelect });
  </script>

  <!-- ═══════════════════════════════════════════════════════════ map.jsx -->
  <script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

const MAP_W = 400, MAP_H = 280, MARGIN_X = 24, MARGIN_Y = 28;

function nodeXY(node) {
  return {
    cx: MARGIN_X + (node.x / 100) * (MAP_W - 2 * MARGIN_X),
    cy: MARGIN_Y + (node.y / 100) * (MAP_H - 2 * MARGIN_Y),
  };
}

function manhattanPath(a, b) {
  const midY = a.cy + (b.cy - a.cy) * 0.55;
  return `M ${a.cx} ${a.cy} L ${a.cx} ${midY} L ${b.cx} ${midY} L ${b.cx} ${b.cy}`;
}

function pointOnManhattan(a, b, t) {
  const midY = a.cy + (b.cy - a.cy) * 0.55;
  const l1 = Math.abs(midY - a.cy), l2 = Math.abs(b.cx - a.cx), l3 = Math.abs(b.cy - midY);
  const total = l1 + l2 + l3 || 1;
  const d = t * total;
  if (d <= l1) return { x: a.cx, y: a.cy + Math.sign(midY - a.cy) * d };
  if (d <= l1 + l2) return { x: a.cx + Math.sign(b.cx - a.cx) * (d - l1), y: midY };
  return { x: b.cx, y: midY + Math.sign(b.cy - midY) * (d - l1 - l2) };
}

function NodeTypeIcon({ type, theme, size = 5 }) {
  if (type === 'bay') return null;
  if (type === 'lk') return <rect x={-size*0.5} y={-size*0.6} width={size} height={size*1.2} fill="none" stroke={theme.card} strokeWidth="0.9" rx="0.6" />;
  if (type === 'gate') return (<><line x1={-size*0.6} y1={-size*0.7} x2={-size*0.6} y2={size*0.7} stroke={theme.card} strokeWidth="1" strokeLinecap="round"/><line x1={size*0.6} y1={-size*0.7} x2={size*0.6} y2={size*0.7} stroke={theme.card} strokeWidth="1" strokeLinecap="round"/></>);
  return <rect x={-size*0.5} y={-size*0.5} width={size} height={size} fill="none" stroke={theme.card} strokeWidth="0.9" />;
}

function FabMap({ nodes, robots, theme, sketchIntensity = 0.5, mode = 'select', selectable = 'all',
  selectedId, departureId, arrivalId, currentLocId, activeRobotId, matchedRobotId,
  routeProgress = 0, onNodeTap, highlightRecommend, filters = { call: true, locker: true }, dark = false }) {

  const isSelectable = (n) => {
    if (typeof selectable === 'function') return selectable(n);
    if (Array.isArray(selectable)) return selectable.includes(n.id);
    if (selectable === 'bays-eqs') return n.type === 'bay' || n.type === 'eq';
    if (selectable === 'lockers') return n.type === 'lk';
    return true;
  };

  const filterId = useMemo(() => `sketch-${Math.random().toString(36).slice(2, 8)}`, []);
  const scale = Math.max(0, Math.min(1, sketchIntensity)) * 1.8;

  const activeRobot = robots.find(r => r.id === activeRobotId);
  const depNode = nodes.find(n => n.id === departureId);
  const arrNode = nodes.find(n => n.id === arrivalId);
  const depXY = depNode && nodeXY(depNode);
  const arrXY = arrNode && nodeXY(arrNode);

  let robotPos = null;
  if (mode === 'enroute' && depXY && arrXY) {
    robotPos = pointOnManhattan(depXY, arrXY, routeProgress);
  }

  return (
    <svg viewBox={`0 0 ${MAP_W} ${MAP_H}`} style={{ width: '100%', height: '100%', display: 'block', userSelect: 'none' }}>
      <defs>
        <filter id={filterId} x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="3" />
          <feDisplacementMap in="SourceGraphic" scale={scale} />
        </filter>
        <pattern id={`dot-${filterId}`} width="8" height="8" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.7" fill={theme.border} opacity="0.7"/>
        </pattern>
      </defs>

      <rect x="0" y="0" width={MAP_W} height={MAP_H} fill={dark ? theme.bg : theme.bg}/>
      <rect x="0" y="0" width={MAP_W} height={MAP_H} fill={`url(#dot-${filterId})`}/>

      <g filter={`url(#${filterId})`}>
        <rect x="10" y="10" width={MAP_W-20} height={MAP_H-20} fill="none" stroke={theme.muted} strokeOpacity="0.35" strokeWidth="1.2" strokeDasharray="4 4" rx="6"/>
        <line x1={MARGIN_X} y1={MAP_H*0.33} x2={MAP_W-MARGIN_X} y2={MAP_H*0.33} stroke={theme.muted} strokeOpacity="0.12" strokeWidth="14" strokeLinecap="round"/>
        <line x1={MARGIN_X} y1={MAP_H*0.66} x2={MAP_W-MARGIN_X} y2={MAP_H*0.66} stroke={theme.muted} strokeOpacity="0.12" strokeWidth="14" strokeLinecap="round"/>
      </g>

      {depXY && arrXY && (mode === 'enroute' || mode === 'view') && (
        <g filter={`url(#${filterId})`}>
          <path d={manhattanPath(depXY, arrXY)} fill="none" stroke={theme.core} strokeWidth="2.4"
            strokeDasharray={mode === 'enroute' ? '0' : '5 4'} strokeLinecap="round" strokeLinejoin="round" opacity="0.9"/>
          {mode === 'enroute' && (
            <path d={manhattanPath(depXY, arrXY)} fill="none" stroke={theme.bright} strokeWidth="2.4"
              strokeDasharray="6 8" strokeLinecap="round" opacity="0.6">
              <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.2s" repeatCount="indefinite"/>
            </path>
          )}
        </g>
      )}

      {nodes.map(n => {
        const { cx, cy } = nodeXY(n);
        const isSel = n.id === selectedId, isDep = n.id === departureId, isArr = n.id === arrivalId;
        const isCur = n.id === currentLocId, tappable = isSelectable(n) && mode === 'select';
        const recommended = highlightRecommend && highlightRecommend.includes(n.id);
        let fill = theme.card, stroke = theme.muted, r = 9;
        if (isDep) { fill = theme.core; stroke = theme.core; r = 11; }
        else if (isArr) { fill = theme.bright; stroke = theme.bright; r = 11; }
        else if (isSel) { fill = theme.core; stroke = theme.core; r = 11; }
        else if (tappable) { stroke = theme.core; fill = dark ? theme.card : '#fff'; }
        return (
          <g key={n.id}>
            <g filter={`url(#${filterId})`}>
              {recommended && (
                <circle cx={cx} cy={cy} r={r+6} fill="none" stroke={theme.bright} strokeWidth="1.4" strokeDasharray="3 3" opacity="0.7">
                  <animateTransform attributeName="transform" type="rotate" from={`0 ${cx} ${cy}`} to={`360 ${cx} ${cy}`} dur="14s" repeatCount="indefinite"/>
                </circle>
              )}
              {isCur && !isDep && !isArr && (
                <>
                  <circle cx={cx} cy={cy} r={r+4} fill={theme.bright} fillOpacity="0.18"/>
                  <circle cx={cx} cy={cy} r={r+4} fill="none" stroke={theme.bright} strokeWidth="1.2" opacity="0.6">
                    <animate attributeName="r" from={r+2} to={r+9} dur="1.8s" repeatCount="indefinite"/>
                    <animate attributeName="opacity" from="0.6" to="0" dur="1.8s" repeatCount="indefinite"/>
                  </circle>
                </>
              )}
              <circle cx={cx} cy={cy} r={r} fill={fill} stroke={stroke}
                strokeWidth={isSel || isDep || isArr ? 2 : 1.4}
                style={{ cursor: tappable ? 'pointer' : 'default', transition: 'r 0.18s ease' }}/>
              <g transform={`translate(${cx} ${cy})`}>
                <NodeTypeIcon type={n.type} theme={isSel || isDep || isArr ? { card: '#fff' } : { card: theme.muted }} size={6}/>
              </g>
            </g>
            {tappable && (
              <circle cx={cx} cy={cy} r={18} fill="transparent" style={{ cursor: 'pointer' }}
                onClick={(e) => { e.stopPropagation(); onNodeTap && onNodeTap(n); }}/>
            )}
            <text x={cx} y={cy+r+12} fontFamily="'JetBrains Mono', ui-monospace, monospace"
              fontSize="9" fontWeight="500"
              fill={isSel || isDep || isArr || isCur ? theme.deep : theme.muted}
              textAnchor="middle" style={{ pointerEvents: 'none' }}>{n.id}</text>
          </g>
        );
      })}

      {robots.map(r => {
        if (mode === 'enroute' && r.id === activeRobotId) return null;
        const atNode = nodes.find(n => n.id === r.at);
        if (!atNode) return null;
        const { cx, cy } = nodeXY(atNode);
        const ox = cx + 19, oy = cy - 12;
        const GRAY = '#94A3B8';
        const focusedId = matchedRobotId || activeRobotId;
        const caps = r.capabilities || [];
        const hasLocker = caps.includes('locker');
        const isInUse = r.status !== 'idle';
        let bg, fg;
        if (focusedId) {
          if (r.id === focusedId) { bg = (filters.locker && hasLocker) ? theme.bright : theme.deep; fg = '#fff'; }
          else { bg = GRAY; fg = '#fff'; }
        } else if (isInUse) { bg = GRAY; fg = '#fff'; }
        else if (filters.locker && hasLocker) { bg = theme.bright; fg = '#fff'; }
        else { bg = theme.deep; fg = '#fff'; }
        return (
          <g key={r.id} style={{ pointerEvents: 'none' }}>
            <g filter={`url(#${filterId})`}>
              <line x1={cx+6} y1={cy-6} x2={ox-17} y2={oy+2} stroke={bg} strokeWidth="0.8" opacity="0.4"/>
              <rect x={ox-19} y={oy-7.5} width="38" height="15" rx="3" fill={bg} stroke={theme.card} strokeWidth="1"/>
              <g transform={`translate(${ox-12} ${oy})`}>
                <line x1="0" y1="-4.5" x2="0" y2="-3" stroke={fg} strokeWidth="0.7" strokeLinecap="round"/>
                <circle cx="0" cy="-4.6" r="0.7" fill={fg}/>
                <rect x="-2.6" y="-3" width="5.2" height="4.4" rx="0.9" fill="none" stroke={fg} strokeWidth="0.7"/>
                <circle cx="-1" cy="-1.1" r="0.6" fill={fg}/>
                <circle cx="1" cy="-1.1" r="0.6" fill={fg}/>
                <line x1="-2.6" y1="2.2" x2="2.6" y2="2.2" stroke={fg} strokeWidth="0.6"/>
              </g>
              <text x={ox+4} y={oy+2.4} fontFamily="'JetBrains Mono', monospace"
                fontSize="6.5" fontWeight="700" fill={fg} textAnchor="middle">{r.id}</text>
            </g>
          </g>
        );
      })}

      {robotPos && activeRobot && (
        <g style={{ pointerEvents: 'none' }}>
          <circle cx={robotPos.x} cy={robotPos.y} r="14" fill={theme.bright} fillOpacity="0.18">
            <animate attributeName="r" from="10" to="18" dur="1.2s" repeatCount="indefinite"/>
            <animate attributeName="fill-opacity" from="0.3" to="0" dur="1.2s" repeatCount="indefinite"/>
          </circle>
          <g filter={`url(#${filterId})`}>
            <rect x={robotPos.x-20} y={robotPos.y-8.5} width="40" height="17" rx="3.5" fill={theme.bright} stroke={theme.card} strokeWidth="1.2"/>
            <g transform={`translate(${robotPos.x-12} ${robotPos.y})`}>
              <line x1="0" y1="-5" x2="0" y2="-3.5" stroke="#fff" strokeWidth="0.8" strokeLinecap="round"/>
              <circle cx="0" cy="-5.2" r="0.8" fill="#fff"/>
              <rect x="-3" y="-3.5" width="6" height="5" rx="1" fill="none" stroke="#fff" strokeWidth="0.8"/>
              <circle cx="-1.2" cy="-1.3" r="0.7" fill="#fff"/>
              <circle cx="1.2" cy="-1.3" r="0.7" fill="#fff"/>
              <line x1="-3" y1="2.5" x2="3" y2="2.5" stroke="#fff" strokeWidth="0.7"/>
            </g>
            <text x={robotPos.x+5} y={robotPos.y+2.6} fontFamily="'JetBrains Mono', monospace"
              fontSize="7" fontWeight="700" fill="#fff" textAnchor="middle">{activeRobot.id}</text>
          </g>
        </g>
      )}
    </svg>
  );
}

Object.assign(window, { FabMap, nodeXY, manhattanPath });
  </script>

  <script type="text/babel">
const { useState: useStateD, useEffect: useEffectD } = React;

function TopTabs({ value, onChange, theme }) {
  const tabs = [{ id: 'delivery', label: '배송' }, { id: 'locker', label: '스마트 락커' }];
  const activeIdx = tabs.findIndex(t => t.id === value);
  return (
    <div style={{ padding: '10px 16px 0' }}>
      <div style={{
        position: 'relative', display: 'flex',
        background: theme.bg,
        borderRadius: 16,
        padding: 4,
        boxShadow: `inset 0 0 0 1.2px ${theme.border}`,
      }}>
        {/* sliding pill */}
        <div style={{
          position: 'absolute',
          top: 4, bottom: 4,
          left: `calc(4px + ${activeIdx} * 50%)`,
          width: 'calc(50% - 4px)',
          background: theme.card,
          borderRadius: 12,
          boxShadow: `0 1px 4px rgba(0,0,0,0.10), inset 0 0 0 1.5px ${theme.core}`,
          transition: 'left 0.22s cubic-bezier(0.4, 0, 0.2, 1)',
          pointerEvents: 'none',
        }}/>
        {tabs.map((t, i) => {
          const active = value === t.id;
          return (
            <button key={t.id} onClick={() => onChange(t.id)} style={{
              flex: 1, border: 'none', background: 'transparent',
              borderRadius: 12, padding: '13px 12px',
              fontFamily: 'inherit', fontSize: 15, fontWeight: 700,
              color: active ? theme.core : theme.muted,
              cursor: 'pointer', position: 'relative', zIndex: 1,
              letterSpacing: '-0.02em', whiteSpace: 'nowrap',
              transition: 'color 0.18s',
            }}>{t.label}</button>
          );
        })}
      </div>
    </div>
  );
}

function StepIndicator({ step, departure, arrival, theme }) {
  const steps = [
    { id: 'departure', label: '출발', value: departure },
    { id: 'arrival',   label: '도착', value: arrival },
    { id: 'call',      label: '호출' },
  ];
  const activeIdx = steps.findIndex(s => s.id === step);
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 4, padding: '14px 14px 10px' }}>
      {steps.map((s, i) => {
        const active = i === activeIdx, done = i < activeIdx;
        const bg = active ? theme.core : done ? theme.sky : 'transparent';
        const fg = active ? '#fff' : done ? theme.core : theme.muted;
        const stroke = active ? theme.core : done ? theme.sky : theme.border;
        return (
          <React.Fragment key={s.id}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 5, padding: '5px 9px 5px 4px', borderRadius: 999,
              background: bg, boxShadow: `inset 0 0 0 1.4px ${stroke}`, whiteSpace: 'nowrap', flexShrink: 0 }}>
              <div style={{ width: 20, height: 20, borderRadius: '50%',
                background: active ? '#fff' : done ? theme.core : 'transparent',
                color: active ? theme.core : done ? '#fff' : theme.muted,
                boxShadow: !active && !done ? `inset 0 0 0 1.4px ${theme.border}` : 'none',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                fontFamily: "'JetBrains Mono', monospace", fontSize: 11, fontWeight: 700 }}>
                {done ? '✓' : i + 1}
              </div>
              <span style={{ fontSize: 13, fontWeight: 600, color: fg, letterSpacing: '-0.01em' }}>{s.label}</span>
              {s.value && (
                <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11.5, fontWeight: 700,
                  padding: '1.5px 6px', borderRadius: 5,
                  background: active ? 'rgba(255,255,255,0.22)' : 'rgba(0,47,108,0.08)',
                  color: active ? '#fff' : theme.deep, letterSpacing: 0 }}>{s.value}</span>
              )}
            </div>
            {i < steps.length - 1 && <div style={{ flex: 'none', color: theme.muted, fontSize: 12 }}>→</div>}
          </React.Fragment>
        );
      })}
    </div>
  );
}

function MapFilters({ filters, onToggle, robots, theme }) {
  const lockerCount = robots.filter(r => (r.capabilities || []).includes('locker') && r.status === 'idle').length;
  const active = filters.locker;
  return (
    <div style={{ display: 'flex', justifyContent: 'flex-end', padding: '8px 14px 4px' }}>
      <button onClick={() => onToggle('locker')} style={{
        padding: '7px 12px', borderRadius: 999, border: 'none', cursor: 'pointer', fontFamily: 'inherit',
        background: active ? theme.bright : 'transparent', color: active ? '#fff' : theme.muted,
        boxShadow: active ? `inset 0 0 0 1.4px ${theme.bright}` : 'none',
        display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 7,
        fontSize: 11.5, fontWeight: 600, letterSpacing: '-0.01em', whiteSpace: 'nowrap',
        transition: 'all 0.18s', opacity: active ? 1 : 0.85 }}>
        <span>스마트 락커 가능</span>
        <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, fontWeight: 700,
          color: active ? '#fff' : theme.muted, padding: '1px 6px', borderRadius: 999,
          background: active ? 'rgba(255,255,255,0.22)' : 'transparent',
          boxShadow: !active ? `inset 0 0 0 1px ${theme.border}` : 'none', flexShrink: 0 }}>{lockerCount}</span>
      </button>
    </div>
  );
}

function MapHeader({ title, subtitle, badge, theme }) {
  return (
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', padding: '12px 14px 0', gap: 8 }}>
      <div style={{ minWidth: 0, flex: 1 }}>
        <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, color: theme.muted, fontWeight: 500, letterSpacing: '0.04em', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{title}</div>
        {subtitle && <div style={{ fontSize: 12, color: theme.muted, marginTop: 2, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{subtitle}</div>}
      </div>
      {badge}
    </div>
  );
}

function MapBadge({ children, theme, dotColor }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '4px 9px', borderRadius: 999,
      background: theme.card, boxShadow: `inset 0 0 0 1px ${theme.border}`,
      fontSize: 11, fontWeight: 600, color: theme.deep, whiteSpace: 'nowrap', flexShrink: 0 }}>
      <div style={{ width: 7, height: 7, borderRadius: 2, background: dotColor || theme.core, flexShrink: 0 }}/>
      {children}
    </div>
  );
}

function MapZoomControls({ theme }) {
  const btn = (label) => (
    <button style={{ width: 36, height: 36, border: 'none', cursor: 'pointer',
      background: theme.card, color: theme.deep, fontSize: 18, fontWeight: 600,
      fontFamily: 'inherit', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>{label}</button>
  );
  return (
    <div style={{ position: 'absolute', right: 12, bottom: 12, display: 'flex', flexDirection: 'column',
      borderRadius: 10, overflow: 'hidden',
      boxShadow: `0 2px 8px ${theme.deep}15, inset 0 0 0 1px ${theme.border}` }}>
      {btn('+')}
      <div style={{ height: 1, background: theme.border }}/>
      {btn('−')}
    </div>
  );
}

function MapContainer({ children, theme }) {
  return (
    <div style={{ margin: '10px 16px 0', borderRadius: 16, background: theme.bg,
      boxShadow: `inset 0 0 0 1.2px ${theme.border}`, position: 'relative', overflow: 'hidden' }}>
      {children}
    </div>
  );
}

function ActionCard({ icon, title, subtitle, action, theme, accent }) {
  return (
    <div style={{ margin: '12px 16px 16px', padding: '14px 16px', borderRadius: 14, background: theme.card,
      boxShadow: `inset 0 0 0 1.2px ${theme.border}`, display: 'flex', alignItems: 'center', gap: 12 }}>
      {icon && (
        <div style={{ width: 38, height: 38, borderRadius: 10, flexShrink: 0,
          background: accent || theme.sky, color: theme.deep,
          display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 20 }}>{icon}</div>
      )}
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 15, fontWeight: 700, color: theme.deep, letterSpacing: '-0.01em', lineHeight: 1.3 }}>{title}</div>
        {subtitle && <div style={{ fontSize: 12, color: theme.muted, marginTop: 2, lineHeight: 1.4 }}>{subtitle}</div>}
      </div>
      {action}
    </div>
  );
}

function PrimaryButton({ children, onClick, theme, disabled, full, variant = 'primary' }) {
  const bg = disabled ? theme.border : variant === 'primary' ? theme.core : variant === 'danger' ? '#DC2626' : 'transparent';
  const fg = disabled ? theme.muted : variant === 'primary' || variant === 'danger' ? '#fff' : theme.core;
  return (
    <button onClick={onClick} disabled={disabled} style={{
      background: bg, color: fg,
      border: variant === 'ghost' ? `1.4px solid ${theme.border}` : 'none',
      padding: full ? '14px 16px' : '10px 16px', borderRadius: 12,
      fontSize: 15, fontWeight: 700, fontFamily: 'inherit', letterSpacing: '-0.01em',
      cursor: disabled ? 'not-allowed' : 'pointer', width: full ? '100%' : 'auto',
      whiteSpace: 'nowrap', transition: 'transform 0.08s, opacity 0.15s' }}
      onMouseDown={e => !disabled && (e.currentTarget.style.transform = 'scale(0.98)')}
      onMouseUp={e => (e.currentTarget.style.transform = 'scale(1)')}
      onMouseLeave={e => (e.currentTarget.style.transform = 'scale(1)')}>{children}</button>
  );
}

function PointIcon({ theme }) {

        stroke={theme.deep} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>

  );
}

function RouteChip({ label, code, color, onReset, theme }) {

function DepartureScreen({ ctx }) {
  const { state, setState, theme, nodes, robots, currentLoc } = ctx;
  const recs = [currentLoc, nodes.find(n => n.id !== currentLoc && n.type === 'bay')?.id].filter(Boolean);
  const toggleFilter = (k) => setState({ ...state, filters: { ...state.filters, [k]: !state.filters[k] } });
  return (
    <>
      <TopTabs value="delivery" onChange={(v) => setState({ ...state, mode: v })} theme={theme}/>
      <StepIndicator step="departure" departure={state.departure} arrival={state.arrival} theme={theme}/>
      <MapContainer theme={theme}>
        <MapHeader title={`P3 7F · 정류장 ${nodes.length}개`} subtitle="출발지를 탭하세요" theme={theme}/>

        <div style={{ height: 260 }}>
          <FabMap nodes={nodes} robots={robots} filters={state.filters} theme={theme}
            sketchIntensity={state.sketchIntensity} mode="select" currentLocId={currentLoc}

}

function ArrivalScreen({ ctx }) {
  const { state, setState, theme, nodes, robots } = ctx;
  const toggleFilter = (k) => setState({ ...state, filters: { ...state.filters, [k]: !state.filters[k] } });
  const hasArrival = !!state.arrival;
  const resetDeparture = () => setState({ ...state, departure: null, arrival: null, step: 'departure' });
  const resetArrival = () => setState({ ...state, arrival: null });

  const [recipient, setRecipient] = useStateD('');
  const hasRecipient = recipient.trim().length > 0;
  const canCall = hasArrival && hasRecipient;

  const QUICK_PICKS = [
    { id: 'me', label: '나에게 받기', icon: '👤', value: '나' },
    { id: 'fav', label: '최근에 보낸', icon: '🕐', value: null },
  ];
  const [showFavs, setShowFavs] = useStateD(false);
  const FAVS = ['김민준', '이서연', '박지호'];

  return (
    <>
      <TopTabs value="delivery" onChange={(v) => setState({ ...state, mode: v })} theme={theme}/>
      <StepIndicator step="arrival" departure={state.departure} arrival={state.arrival} theme={theme}/>
      <MapContainer theme={theme}>
        <MapHeader title={hasArrival ? `${state.departure} → ${state.arrival}` : `출발 · ${state.departure}`}

          theme={theme}/>
        <MapFilters filters={state.filters} onToggle={toggleFilter} robots={robots} theme={theme}/>
        <div style={{ height: 234 }}>
          <FabMap nodes={nodes} robots={robots} filters={state.filters} theme={theme}
            sketchIntensity={state.sketchIntensity} mode="select"
            departureId={state.departure} arrivalId={state.arrival}
            selectable={() => true}
            onNodeTap={(n) => {
              if (n.id === state.departure) resetDeparture();
              else if (n.id === state.arrival) resetArrival();
              else setState({ ...state, arrival: n.id });
            }} dark={state.dark}/>
        </div>
        <MapZoomControls theme={theme}/>
      </MapContainer>

      <div style={{ margin: '12px 16px 16px', padding: '14px 14px', borderRadius: 14, background: theme.card,
        boxShadow: `inset 0 0 0 1.2px ${theme.border}` }}>

        {/* 출발 / 도착 Route chips */}
        <div style={{ display: 'flex', alignItems: 'stretch', gap: 8, marginBottom: 12 }}>
          <RouteChip label="출발" code={state.departure} color={theme.core} onReset={resetDeparture} theme={theme}/>
          <div style={{ display: 'flex', alignItems: 'center', color: theme.muted, fontSize: 14, padding: '0 2px' }}>→</div>
          {hasArrival ? (
            <RouteChip label="도착" code={state.arrival} color={theme.bright} onReset={resetArrival} theme={theme}/>
          ) : (
            <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center',
              padding: '8px 10px', borderRadius: 10, boxShadow: `inset 0 0 0 1.4px ${theme.border}`,
              fontSize: 12, color: theme.muted, fontWeight: 600 }}>도착지 선택</div>
          )}
        </div>

        {/* 받는 사람 */}
        <div style={{ borderTop: `1px solid ${theme.border}`, paddingTop: 12, marginBottom: 12 }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: theme.muted,
            letterSpacing: '0.04em', textTransform: 'uppercase', marginBottom: 8 }}>받는 사람</div>

          {/* 빠른 선택 버튼 */}
          <div style={{ display: 'flex', gap: 7, marginBottom: 10 }}>
            {/* 나에게 받기 */}
            <button onClick={() => { setRecipient('나'); setShowFavs(false); }}
              style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6,
                border: 'none', borderRadius: 10, padding: '9px 10px', cursor: 'pointer',
                fontFamily: 'inherit', fontSize: 13, fontWeight: 600,
                background: recipient === '나' ? theme.core : theme.bg,
                color: recipient === '나' ? '#fff' : theme.deep,
                boxShadow: recipient === '나'
                  ? `0 2px 8px ${theme.core}44`
                  : `inset 0 0 0 1.2px ${theme.border}`,
                transition: 'all 0.15s' }}>
              <span>👤</span> 나에게 받기
            </button>

            {/* 최근에 보낸 */}
            <button onClick={() => { setShowFavs(v => !v); if (recipient !== '나') setRecipient(''); }}
              style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6,
                border: 'none', borderRadius: 10, padding: '9px 10px', cursor: 'pointer',
                fontFamily: 'inherit', fontSize: 13, fontWeight: 600,
                background: showFavs ? theme.sky : theme.bg,
                color: showFavs ? theme.core : theme.deep,

                transition: 'all 0.15s' }}>
              <span>🕐</span> 최근에 보낸

          </div>

          {/* 즐겨찾기 목록 */}
          {showFavs && (
            <div style={{ borderRadius: 10, overflow: 'hidden',
              boxShadow: `inset 0 0 0 1.2px ${theme.border}`, marginBottom: 10 }}>
              {FAVS.map((name, i) => (
                <button key={name} onClick={() => { setRecipient(name); setShowFavs(false); }}
                  style={{ width: '100%', display: 'flex', alignItems: 'center', gap: 10,
                    border: 'none', borderTop: i > 0 ? `1px solid ${theme.border}` : 'none',
                    background: recipient === name ? theme.sky : theme.card,
                    padding: '10px 12px', cursor: 'pointer', fontFamily: 'inherit',
                    textAlign: 'left', transition: 'background 0.12s' }}>
                  <div style={{ width: 28, height: 28, borderRadius: '50%', flexShrink: 0,
                    background: recipient === name ? theme.core : theme.bg,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    fontSize: 13, color: recipient === name ? '#fff' : theme.muted }}>🕐</div>

            </div>

              style={{ width: '100%', boxSizing: 'border-box', padding: '10px 36px 10px 12px',
                borderRadius: 10, fontSize: 13, fontFamily: 'inherit', color: theme.deep,
                background: theme.bg, outline: 'none', transition: 'border-color 0.15s',

              <button onClick={() => setRecipient('')}

          </div>

          {hasRecipient && (

              padding: '7px 10px', borderRadius: 8, background: theme.sky }}>

            </div>
          )}
        </div>

        {/* 호출 버튼 */}
        {canCall ? (
          <PrimaryButton variant="primary" theme={theme} full
            onClick={() => setState({ ...state, step: 'dispatching', deliveryRecipient: recipient })}>
            🤖  로봇을 호출할래요!
          </PrimaryButton>
        ) : (
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center',
            padding: '12px 10px', borderRadius: 12, background: theme.bg,
            fontSize: 13, color: theme.muted, fontWeight: 600, letterSpacing: '-0.01em' }}>
            {!hasArrival ? '도착지를 선택해주세요' : '받는 사람을 입력해주세요'}
          </div>
        )}
      </div>
    </>
  );
}

function DispatchingScreen({ ctx }) {
  const { state, setState, theme, nodes, robots } = ctx;
  const [phase, setPhase] = useStateD(0);
  const [matchedId, setMatchedId] = useStateD(null);
  useEffectD(() => {
    const t1 = setTimeout(() => setPhase(1), 1300);
    const t2 = setTimeout(() => {
      const idle = robots.find(r => r.status === 'idle');
      setMatchedId(idle ? idle.id : robots[0].id);
      setPhase(2);
    }, 2600);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, []);
  const phaseLabel = ['주변 로봇 스캔 중', '최적 로봇 매칭', '호출 완료'][phase];
  return (
    <>
      <TopTabs value="delivery" onChange={(v) => setState({ ...state, mode: v })} theme={theme}/>
      <StepIndicator step="call" departure={state.departure} arrival={state.arrival} theme={theme}/>
      <MapContainer theme={theme}>
        <MapHeader title={`${state.departure} → ${state.arrival}`} subtitle={phaseLabel}
          badge={<MapBadge theme={theme} dotColor={phase < 2 ? '#F59E0B' : theme.core}>
            {phase < 2 ? '로봇 찾는 중' : 'AMR 매칭 완료'}
          </MapBadge>} theme={theme}/>
        <div style={{ height: 280 }}>
          <FabMap nodes={nodes} robots={robots} theme={theme} sketchIntensity={state.sketchIntensity}
            mode="view" departureId={state.departure} arrivalId={state.arrival}
            matchedRobotId={matchedId} dark={state.dark}/>
        </div>
      </MapContainer>
      <div style={{ margin: '12px 16px 16px', padding: '16px', borderRadius: 14, background: theme.card,
        boxShadow: `inset 0 0 0 1.2px ${theme.border}` }}>
        {phase < 2 ? (
          <>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 12 }}>
              <div style={{ width: 32, height: 32, borderRadius: '50%',
                background: `conic-gradient(${theme.core} 0deg, ${theme.core} 90deg, ${theme.sky} 90deg)`,
                animation: 'spin 1.2s linear infinite' }}/>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 15, fontWeight: 700, color: theme.deep }}>{phaseLabel}</div>
                <div style={{ fontSize: 12, color: theme.muted, marginTop: 2 }}>P3 7F · {robots.length}대 중 가용 로봇 확인 중</div>
              </div>
            </div>
            <div style={{ display: 'flex', gap: 6, marginBottom: 8 }}>
              {robots.map(r => (
                <div key={r.id} style={{ flex: 1, padding: '6px 4px', borderRadius: 8, background: theme.bg,
                  textAlign: 'center', fontFamily: "'JetBrains Mono', monospace", fontSize: 9,
                  color: theme.muted, fontWeight: 600,
                  opacity: phase === 0 ? 1 : (matchedId === r.id ? 1 : 0.35),
                  border: matchedId === r.id ? `1.4px solid ${theme.core}` : `1.4px solid transparent`,
                  transition: 'all 0.3s' }}>{r.id}</div>
              ))}
            </div>
            <PrimaryButton variant="ghost" theme={theme} full
              onClick={() => setState({ ...state, step: 'arrival', arrival: null })}>취소</PrimaryButton>
          </>
        ) : (
          <>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 12 }}>
              <div style={{ width: 44, height: 28, borderRadius: 6, background: theme.bright, color: '#fff',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, fontSize: 13 }}>{matchedId}</div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 15, fontWeight: 700, color: theme.deep }}>{matchedId} 매칭 완료</div>
                <div style={{ fontSize: 12, color: theme.muted, marginTop: 2 }}>예상 ETA · 3분 24초</div>
              </div>
              <div style={{ fontSize: 11, color: theme.muted, fontFamily: "'JetBrains Mono', monospace" }}>
                BAT {robots.find(r => r.id === matchedId)?.battery}%
              </div>
            </div>
            <div style={{ display: 'flex', gap: 8 }}>
              <PrimaryButton variant="ghost" theme={theme}
                onClick={() => setState({ ...state, step: 'arrival', arrival: null })}>취소</PrimaryButton>
              <div style={{ flex: 1 }}>
                <PrimaryButton variant="primary" theme={theme} full
                  onClick={() => setState({ ...state, step: 'enroute-dep', activeRobot: matchedId, routeProgress: 0 })}>
                  출발 시작
                </PrimaryButton>
              </div>
            </div>
          </>
        )}
      </div>
    </>
  );
}

// ─── 로봇 → 출발지 이동 중 ──────────────────────────────────
function EnRouteDepScreen({ ctx }) {
  const { state, setState, theme, nodes, robots } = ctx;
  const totalSec = 60;
  const remain = Math.max(0, totalSec - Math.round(state.routeProgress * totalSec));
  const mm = Math.floor(remain / 60), ss = String(remain % 60).padStart(2, '0');
  const robotObj = robots.find(r => r.id === state.activeRobot);

  useEffectD(() => {
    if (state.routeProgress >= 1) {
      const t = setTimeout(() => setState({ ...state, step: 'at-departure' }), 600);
      return () => clearTimeout(t);
    }
    const t = setTimeout(() => setState({ ...state, routeProgress: Math.min(1, state.routeProgress + 1/totalSec) }), 1000);
    return () => clearTimeout(t);
  }, [state.routeProgress]);

  return (
    <>
      <TopTabs value="delivery" onChange={(v) => setState({ ...state, mode: v })} theme={theme}/>
      <StepIndicator step="call" departure={state.departure} arrival={state.arrival} theme={theme}/>
      <MapContainer theme={theme}>
        <MapHeader title={`${state.activeRobot} → ${state.departure}`}
          subtitle={`출발지로 이동 중 · ${Math.round(state.routeProgress * 100)}% 경과`}
          badge={<MapBadge theme={theme} dotColor={theme.bright}>LIVE</MapBadge>} theme={theme}/>
        <div style={{ height: 280 }}>
          <FabMap nodes={nodes} robots={robots} theme={theme} sketchIntensity={state.sketchIntensity}
            mode="enroute" departureId={robotObj?.at} arrivalId={state.departure}
            activeRobotId={state.activeRobot} routeProgress={state.routeProgress} dark={state.dark}/>
        </div>
      </MapContainer>
      <div style={{ margin: '12px 16px 16px', padding: '14px 16px', borderRadius: 14, background: theme.card,
        boxShadow: `inset 0 0 0 1.2px ${theme.border}` }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 12 }}>
          <div>
            <div style={{ fontSize: 12, color: theme.muted, fontWeight: 600 }}>출발지 도착까지</div>
            <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 32, fontWeight: 700,
              color: theme.deep, letterSpacing: '-0.02em', lineHeight: 1, marginTop: 4 }}>{mm}:{ss}</div>
          </div>
          <div style={{ textAlign: 'right' }}>
            <div style={{ fontSize: 12, color: theme.muted }}>{state.activeRobot}</div>
            <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 14, fontWeight: 700, color: theme.deep, marginTop: 2 }}>BAT {robotObj?.battery}%</div>
          </div>
        </div>
        <div style={{ height: 6, background: theme.border, borderRadius: 3, overflow: 'hidden', marginBottom: 12 }}>
          <div style={{ height: '100%', width: `${state.routeProgress * 100}%`,
            background: `linear-gradient(90deg, ${theme.core}, ${theme.bright})`,
            borderRadius: 3, transition: 'width 0.6s linear' }}/>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <PrimaryButton variant="ghost" theme={theme}
            onClick={() => setState({ ...state, step: 'departure', departure: null, arrival: null, activeRobot: null, routeProgress: 0 })}>
            호출 취소
          </PrimaryButton>
          <div style={{ flex: 1 }}>
            <PrimaryButton variant="primary" theme={theme} full
              onClick={() => setState({ ...state, routeProgress: 1 })}>스킵 → 도착</PrimaryButton>
          </div>
        </div>
      </div>
    </>
  );
}

// ─── 출발지에 로봇 도착 / 물품 적재 ─────────────────────────

// ─── 로봇 → 도착지 이동 중 ──────────────────────────────────
function EnRouteArrScreen({ ctx }) {
  const { state, setState, theme, nodes, robots } = ctx;
  const totalSec = 90;
  const remain = Math.max(0, totalSec - Math.round(state.routeProgress * totalSec));
  const mm = Math.floor(remain / 60), ss = String(remain % 60).padStart(2, '0');
  const robotObj = robots.find(r => r.id === state.activeRobot);

  useEffectD(() => {
    if (state.routeProgress >= 1) {
      const t = setTimeout(() => setState({ ...state, step: 'at-arrival' }), 600);
      return () => clearTimeout(t);
    }
    const t = setTimeout(() => setState({ ...state, routeProgress: Math.min(1, state.routeProgress + 1/totalSec) }), 1000);
    return () => clearTimeout(t);
  }, [state.routeProgress]);

  return (
    <>
      <TopTabs value="delivery" onChange={(v) => setState({ ...state, mode: v })} theme={theme}/>
      <StepIndicator step="call" departure={state.departure} arrival={state.arrival} theme={theme}/>
      <MapContainer theme={theme}>
        <MapHeader title={`${state.departure} → ${state.arrival}`}
          subtitle={`${state.activeRobot} 배송 중 · ${Math.round(state.routeProgress * 100)}% 경과`}
          badge={<MapBadge theme={theme} dotColor={theme.bright}>LIVE</MapBadge>} theme={theme}/>
        <div style={{ height: 280 }}>
          <FabMap nodes={nodes} robots={robots} theme={theme} sketchIntensity={state.sketchIntensity}
            mode="enroute" departureId={state.departure} arrivalId={state.arrival}
            activeRobotId={state.activeRobot} routeProgress={state.routeProgress} dark={state.dark}/>
        </div>
      </MapContainer>
      <div style={{ margin: '12px 16px 16px', padding: '14px 16px', borderRadius: 14, background: theme.card,
        boxShadow: `inset 0 0 0 1.2px ${theme.border}` }}>
        {/* 받는 사람 표시 */}

          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 12,
            padding: '9px 12px', borderRadius: 10, background: theme.bg }}>
            <div style={{ fontSize: 16 }}>👤</div>
            <div>
              <div style={{ fontSize: 11, color: theme.muted, fontWeight: 600 }}>받는 사람</div>
              <div style={{ fontSize: 14, fontWeight: 700, color: theme.deep, marginTop: 1 }}>{state.deliveryRecipient}</div>
            </div>
          </div>
        )}
        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 12 }}>
          <div>
            <div style={{ fontSize: 12, color: theme.muted, fontWeight: 600 }}>도착지까지</div>
            <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 32, fontWeight: 700,
              color: theme.deep, letterSpacing: '-0.02em', lineHeight: 1, marginTop: 4 }}>{mm}:{ss}</div>
          </div>
          <div style={{ textAlign: 'right' }}>
            <div style={{ fontSize: 12, color: theme.muted }}>{state.activeRobot}</div>
            <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 14, fontWeight: 700, color: theme.deep, marginTop: 2 }}>BAT {robotObj?.battery}%</div>
          </div>
        </div>
        <div style={{ height: 6, background: theme.border, borderRadius: 3, overflow: 'hidden', marginBottom: 12 }}>
          <div style={{ height: '100%', width: `${state.routeProgress * 100}%`,
            background: `linear-gradient(90deg, ${theme.core}, ${theme.bright})`,
            borderRadius: 3, transition: 'width 0.6s linear' }}/>

          onClick={() => setState({ ...state, routeProgress: 1 })}>스킵 → 도착</PrimaryButton>
      </div>
    </>
  );
}

// ─── 도착지에 로봇 도착 / 수령 확인 ─────────────────────────
function AtArrivalScreen({ ctx }) {
  const { state, setState, theme, pushHistory } = ctx;
  const [phase, setPhase] = useStateD(0); // 0: 확인 중, 1: 수령 완료

  useEffectD(() => {

      <div style={{ margin: '14px 16px 0', padding: '20px 18px', borderRadius: 16, color: '#fff',

          </div>

            <div style={{ fontSize: 20 }}>{phase === 1 ? '✅' : '⏳'}</div>

              </div>
              {state.deliveryRecipient && (

      <div style={{ margin: '12px 16px 0', padding: '14px 16px', borderRadius: 14, background: theme.card,
        boxShadow: `inset 0 0 0 1.2px ${theme.border}` }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 12, color: theme.muted, fontWeight: 600 }}>배송 경로</div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 4,
              fontFamily: "'JetBrains Mono', monospace", fontSize: 13, fontWeight: 700, color: theme.deep }}>
              <span>{state.departure}</span>
              <span style={{ color: theme.muted, fontWeight: 400 }}>→</span>

Object.assign(window, { TopTabs, StepIndicator, MapHeader, MapBadge, MapContainer, MapZoomControls,

  </script>

          const active = filter === f.id;
          return (
            <button key={f.id} onClick={() => setFilter(f.id)} style={{ border: 'none', borderRadius: 999, padding: '8px 14px',
              background: active ? theme.deep : theme.card, color: active ? '#fff' : theme.deep,
              boxShadow: !active ? `inset 0 0 0 1.2px ${theme.border}` : 'none',
              fontSize: 13, fontWeight: 600, fontFamily: 'inherit', cursor: 'pointer', letterSpacing: '-0.01em',
              display: 'inline-flex', alignItems: 'center', gap: 6 }}>
              {f.label}
              <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, opacity: 0.7 }}>{f.count}</span>
            </button>
          );
        })}
      </div>
      <div style={{ padding: '0 16px 16px' }}>
        {items.map(h => {
          const isDelivery = h.kind === 'delivery';
          const sc = ({ done: { bg: theme.sky, fg: theme.deep, label: '완료' }, cancelled: { bg: '#FEE2E2', fg: '#991B1B', label: '취소' }, stored: { bg: theme.sky, fg: theme.deep, label: '보관 중' }, retrieved: { bg: theme.sky, fg: theme.deep, label: '수령' } })[h.status] || { bg: theme.sky, fg: theme.deep, label: '완료' };
          return (
            <div key={h.id} style={{ display: 'flex', gap: 12, padding: '14px', borderRadius: 14, background: theme.card, boxShadow: `inset 0 0 0 1.2px ${theme.border}`, marginBottom: 8 }}>
              <div style={{ width: 38, height: 38, borderRadius: 10, flexShrink: 0, background: isDelivery ? theme.sky : theme.bg, color: theme.deep, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 18 }}>{isDelivery ? '⤴' : '⬚'}</div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: 8 }}>
                  <div style={{ fontSize: 14.5, fontWeight: 700, color: theme.deep, letterSpacing: '-0.01em', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{h.item}</div>
                  <div style={{ display: 'inline-flex', padding: '2px 8px', borderRadius: 999, background: sc.bg, color: sc.fg, fontSize: 10.5, fontWeight: 700, flexShrink: 0 }}>{sc.label}</div>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 4, fontFamily: "'JetBrains Mono', monospace", fontSize: 11.5, color: theme.muted }}>
                  <span>{h.from}</span>
                  {h.to && <><span style={{ opacity: 0.5 }}>→</span><span>{h.to}</span></>}
                  {h.robot && <><span style={{ opacity: 0.3 }}>·</span><span>{h.robot}</span></>}
                </div>
                <div style={{ fontSize: 11.5, color: theme.muted, marginTop: 4, display: 'flex', gap: 8 }}>
                  <span>{h.when}</span>{h.durationMin && <span>· {h.durationMin}분 소요</span>}
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </>
  );
}

Object.assign(window, {
  LockerHomeScreen, LockerStoreNodeScreen, LockerStoreDispatchScreen,
  LockerStoreEnrouteScreen, LockerStoreArriveScreen, LockerStoreDoneScreen,
  LockerRetrieveListScreen, LockerRetrieveNodeScreen, LockerRetrieveEnrouteScreen,
  LockerRetrieveArriveScreen, LockerRetrieveDoneScreen, HistoryScreen,
});
  </script>

  <!-- ═══════════════════════════════════════════════════════════ app.jsx -->
  <script type="text/babel">
const { useState: useStateA, useEffect: useEffectA } = React;

function PhoneShell({ children, theme, dark, scale = 1 }) {
  const W = 392, H = 832;
  return (
    <div style={{ width: W * scale, height: H * scale, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <div style={{ width: W, height: H, transform: `scale(${scale})`, transformOrigin: 'top left',
        borderRadius: 44, overflow: 'hidden', background: theme.surface,
        border: `9px solid ${dark ? '#1a1a1f' : '#171a22'}`,
        boxShadow: '0 30px 80px rgba(0,47,108,0.28), 0 0 0 1px rgba(0,0,0,0.04)',
        position: 'absolute', top: 0, left: 0, display: 'flex', flexDirection: 'column', boxSizing: 'border-box' }}>
        <PhoneStatusBar theme={theme} dark={dark}/>
        <div style={{ flex: 1, overflowY: 'auto', overflowX: 'hidden', background: theme.surface }}>
          {children}
        </div>
        <PhoneNavBar theme={theme}/>
      </div>
    </div>
  );
}

function PhoneStatusBar({ theme, dark }) {
  const c = theme.deep;
  return (
    <div style={{ height: 38, display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      padding: '0 22px', position: 'relative', flexShrink: 0, background: theme.surface }}>
      <span style={{ fontSize: 14, fontWeight: 600, color: c, fontFamily: 'inherit', letterSpacing: '-0.01em' }}>9:30</span>
      <div style={{ position: 'absolute', left: '50%', top: 6, transform: 'translateX(-50%)',
        width: 22, height: 22, borderRadius: '50%', background: '#0a0d14' }}/>
      <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
        <svg width="15" height="11" viewBox="0 0 15 11">
          {[3,5,8,11].map((h,i) => <rect key={i} x={i*3.5} y={11-h} width="2.4" height={h} rx="0.5" fill={c}/>)}
        </svg>
        <svg width="14" height="11" viewBox="0 0 14 11">
          <path d="M7 10.5 L 11 6.5 A 5.5 5.5 0 0 0 3 6.5 Z" fill={c} opacity="0.9"/>
        </svg>
        <svg width="22" height="11" viewBox="0 0 22 11">
          <rect x="0" y="1" width="19" height="9" rx="1.6" fill="none" stroke={c} strokeWidth="0.9"/>
          <rect x="2" y="2.5" width="13" height="6" rx="0.6" fill={c}/>
          <rect x="20" y="3.5" width="1.6" height="4" rx="0.5" fill={c}/>
        </svg>
      </div>
    </div>
  );
}

function PhoneNavBar({ theme }) {
  return (
    <div style={{ height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
      <div style={{ width: 124, height: 4, borderRadius: 2, background: theme.deep, opacity: 0.6 }}/>
    </div>
  );
}

function BottomNav({ value, onChange, theme }) {
  const tabs = [
    { id: 'delivery', label: '배송',      icon: (active) => <NavIconDelivery active={active} theme={theme}/> },
    { id: 'locker',   label: '스마트 락커', icon: (active) => <NavIconLocker active={active} theme={theme}/> },
    { id: 'history',  label: '내역',      icon: (active) => <NavIconHistory active={active} theme={theme}/> },
  ];
  return (
    <div style={{ position: 'sticky', bottom: 0, background: theme.card, borderTop: `1px solid ${theme.border}`,
      display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', paddingBottom: 4, paddingTop: 4 }}>
      {tabs.map(t => {
        const active = value === t.id;
        return (
          <button key={t.id} onClick={() => onChange(t.id)} style={{
            border: 'none', background: 'transparent', cursor: 'pointer', padding: '6px 4px',
            display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2,
            fontFamily: 'inherit', color: active ? theme.core : theme.muted }}>
            {t.icon(active)}
            <span style={{ fontSize: 11, fontWeight: active ? 700 : 600, letterSpacing: '-0.01em', whiteSpace: 'nowrap' }}>{t.label}</span>
          </button>
        );
      })}
    </div>
  );
}

function NavIconDelivery({ active, theme }) {
  const c = active ? theme.core : theme.muted;
  return (
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
      <rect x="2.5" y="7" width="11" height="9" rx="1.4" stroke={c} strokeWidth="1.6" fill={active ? theme.sky : 'none'}/>
      <path d="M13.5 9.5 H 18 L 19.5 12.5 V 16 H 13.5 Z" stroke={c} strokeWidth="1.6" fill={active ? theme.sky : 'none'}/>
      <circle cx="6.5" cy="16.5" r="1.8" fill={theme.card} stroke={c} strokeWidth="1.6"/>
      <circle cx="15.5" cy="16.5" r="1.8" fill={theme.card} stroke={c} strokeWidth="1.6"/>
    </svg>
  );
}

function NavIconLocker({ active, theme }) {
  const c = active ? theme.core : theme.muted;
  return (
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
      <rect x="3" y="3" width="16" height="16" rx="2" stroke={c} strokeWidth="1.6" fill={active ? theme.sky : 'none'}/>
      <line x1="11" y1="3" x2="11" y2="19" stroke={c} strokeWidth="1.6"/>
      <line x1="3" y1="11" x2="19" y2="11" stroke={c} strokeWidth="1.6"/>
      <circle cx="14" cy="14.5" r="1" fill={c}/>
    </svg>
  );
}

function NavIconHistory({ active, theme }) {
  const c = active ? theme.core : theme.muted;
  return (
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
      <circle cx="11" cy="11" r="7.5" stroke={c} strokeWidth="1.6" fill={active ? theme.sky : 'none'}/>
      <path d="M11 6.5 V 11 L 14 13" stroke={c} strokeWidth="1.6" strokeLinecap="round"/>
    </svg>
  );
}

function AppHeader({ theme, location }) {
  return (
    <div style={{ padding: '4px 16px 0', background: theme.surface }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '6px 0' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <div style={{ width: 26, height: 26, borderRadius: 8, background: theme.core, color: '#fff',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontFamily: "'JetBrains Mono', monospace", fontSize: 12, fontWeight: 700, letterSpacing: '-0.02em' }}>C</div>
          <div>
            <div style={{ fontSize: 14, fontWeight: 700, color: theme.deep, letterSpacing: '-0.02em', lineHeight: 1 }}>Connect</div>
            <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, color: theme.muted,
              fontWeight: 500, marginTop: 2, letterSpacing: '0.04em', whiteSpace: 'nowrap' }}>P3 · 7F · {location}</div>
          </div>
        </div>
        <button style={{ width: 36, height: 36, borderRadius: 11, border: `1.2px solid ${theme.border}`,
          background: theme.card, color: theme.deep, cursor: 'pointer',
          display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2 4h12M2 8h12M2 12h12" stroke={theme.deep} strokeWidth="1.6" strokeLinecap="round"/>
          </svg>
        </button>
      </div>
    </div>
  );
}

const TWEAK_DEFAULTS = { theme: 'cobalt', sketchIntensity: 0.6, mapDensity: 'normal', robotCount: 3, dark: false, deviceScale: 1 };

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const theme = getTheme(tweaks.theme, tweaks.dark);
  const nodes = getNodes(tweaks.mapDensity);
  const robots = getRobots(tweaks.robotCount);

  const [state, setState] = useStateA({
    mode: 'delivery', step: 'departure',
    departure: null, arrival: null, activeRobot: null, routeProgress: 0,
    deliveryRecipient: null,
    lockerStep: null,
    lockerDestNode: null, lockerRobot: null, lockerProgress: 0,
    lockerPartItem: null, lockerPartName: '',
    filters: { locker: false },
    sketchIntensity: tweaks.sketchIntensity, dark: tweaks.dark,
  });

  useEffectA(() => {
    setState(s => ({ ...s, sketchIntensity: tweaks.sketchIntensity, dark: tweaks.dark }));
  }, [tweaks.sketchIntensity, tweaks.dark]);

  const [history, setHistory] = useStateA(HISTORY);
  const [storedParts, setStoredParts] = useStateA(STORED_PARTS_SEED);
  const pushHistory = (entry) => setHistory(prev => [{ id: 'n' + Date.now(), ...entry }, ...prev]);
  const currentLoc = 'BAY-02';
  const ctx = { state, setState, theme, nodes, robots, lockers: LOCKER_BANK,
    storedParts, setStoredParts, history, pushHistory, currentLoc };

  let Screen = null;
  if (state.mode === 'delivery') {
    if (state.step === 'departure')   Screen = <DepartureScreen ctx={ctx}/>;
    if (state.step === 'arrival')     Screen = <ArrivalScreen ctx={ctx}/>;
    if (state.step === 'dispatching')   Screen = <DispatchingScreen ctx={ctx}/>;
    if (state.step === 'enroute-dep')   Screen = <EnRouteDepScreen ctx={ctx}/>;
    if (state.step === 'at-departure')  Screen = <AtDepartureScreen ctx={ctx}/>;
    if (state.step === 'enroute-arr')   Screen = <EnRouteArrScreen ctx={ctx}/>;
    if (state.step === 'at-arrival')    Screen = <AtArrivalScreen ctx={ctx}/>;
  } else if (state.mode === 'locker') {
    if (!state.lockerStep)                           Screen = <LockerHomeScreen ctx={ctx}/>;
    else if (state.lockerStep === 'store-node')      Screen = <LockerStoreNodeScreen ctx={ctx}/>;
    else if (state.lockerStep === 'store-dispatch')  Screen = <LockerStoreDispatchScreen ctx={ctx}/>;
    else if (state.lockerStep === 'store-enroute')   Screen = <LockerStoreEnrouteScreen ctx={ctx}/>;
    else if (state.lockerStep === 'store-arrive')    Screen = <LockerStoreArriveScreen ctx={ctx}/>;
    else if (state.lockerStep === 'store-done')      Screen = <LockerStoreDoneScreen ctx={ctx}/>;
    else if (state.lockerStep === 'retrieve-list')   Screen = <LockerRetrieveListScreen ctx={ctx}/>;
    else if (state.lockerStep === 'retrieve-node')   Screen = <LockerRetrieveNodeScreen ctx={ctx}/>;
    else if (state.lockerStep === 'retrieve-enroute') Screen = <LockerRetrieveEnrouteScreen ctx={ctx}/>;
    else if (state.lockerStep === 'retrieve-arrive') Screen = <LockerRetrieveArriveScreen ctx={ctx}/>;
    else if (state.lockerStep === 'retrieve-done')   Screen = <LockerRetrieveDoneScreen ctx={ctx}/>;
  } else if (state.mode === 'history') {
    Screen = <HistoryScreen ctx={ctx}/>;
  }

  return (
    <>
      <PhoneShell theme={theme} dark={tweaks.dark} scale={tweaks.deviceScale}>
        <div style={{ minHeight: '100%', display: 'flex', flexDirection: 'column' }}>
          <div style={{ background: theme.surface, flex: 1, display: 'flex', flexDirection: 'column' }}>
            <AppHeader theme={theme} location={currentLoc}/>
            <div style={{ flex: 1 }}>{Screen}</div>
          </div>
          <BottomNav
            value={state.mode === 'history' ? 'history' : state.mode}
            onChange={(v) => setState({
              ...state, mode: v,
              step: v === 'delivery' ? 'departure' : state.step,
              lockerStep: v === 'locker' ? null : state.lockerStep,
            })}
            theme={theme}/>
        </div>
      </PhoneShell>

      <TweaksPanel title="Tweaks">
        <TweakSection label="테마">
          <TweakRadio label="컬러" value={tweaks.theme}
            options={[{ value: 'cobalt', label: 'Cobalt' }, { value: 'forest', label: 'Forest' }, { value: 'ember', label: 'Ember' }, { value: 'graphite', label: 'Graphite' }]}
            onChange={(v) => setTweak('theme', v)}/>
          <TweakToggle label="다크 모드" value={tweaks.dark} onChange={(v) => setTweak('dark', v)}/>
        </TweakSection>
        <TweakSection label="맵">
          <TweakSlider label="스케치 강도" value={tweaks.sketchIntensity} min={0} max={1.2} step={0.1}
            onChange={(v) => setTweak('sketchIntensity', v)}/>
          <TweakRadio label="정류장 밀도" value={tweaks.mapDensity}
            options={[{ value: 'sparse', label: '적게' }, { value: 'normal', label: '보통' }, { value: 'dense', label: '많게' }]}
            onChange={(v) => setTweak('mapDensity', v)}/>
          <TweakSlider label="로봇 대수" value={tweaks.robotCount} min={2} max={6} step={1}
            onChange={(v) => setTweak('robotCount', v)}/>
        </TweakSection>
        <TweakSection label="디바이스">
          <TweakSlider label="프레임 크기" value={tweaks.deviceScale} min={0.6} max={1.2} step={0.05}
            onChange={(v) => setTweak('deviceScale', v)}/>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
