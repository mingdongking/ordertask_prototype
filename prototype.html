const _ic={};
function Icon({name,size=16,strokeWidth=1.75,className="",style={}}){
  if(!_ic[name]){const reg=(window.lucide&&window.lucide.icons)||{};const k=name.replace(/(^|-)(\w)/g,function(_,a,c){return c.toUpperCase();});_ic[name]=reg[k]||reg[name]||null;}
  const e=_ic[name];
  if(!e)return React.createElement('span',{className:'inline-block '+className,style:{width:size,height:size,...style}});
  function kids(en){if(Array.isArray(en)&&en.length>=3&&Array.isArray(en[2]))return en[2];if(Array.isArray(en)&&en.every(function(n){return Array.isArray(n);}))return en;return[];}
  function rn(node,idx){if(!Array.isArray(node))return null;const tag=node[0],attrs=node[1]||{},ch=node[2];const p={key:idx};for(const k in attrs){if(['stroke-width','stroke-linecap','stroke-linejoin','stroke-dasharray','fill-rule','clip-rule'].includes(k))p[k.replace(/-([a-z])/g,function(_,c){return c.toUpperCase();})]=attrs[k];else p[k]=attrs[k];}return React.createElement(tag,p,Array.isArray(ch)?ch.map(rn):null);}
  return React.createElement('svg',{width:size,height:size,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:strokeWidth,strokeLinecap:'round',strokeLinejoin:'round',className:className,style:style,'aria-hidden':true},kids(e).map(rn));
}

          ))}
        </div>
      </div>
    </div>
  );
}

function KpiCard({ label, value, trend, icon, tone }) {
  const tc = {emerald:"text-emerald-500 bg-emerald-50",blue:"text-blue-500 bg-blue-50",slate:"text-slate-500 bg-slate-100",rose:"text-rose-500 bg-rose-50"}[tone];
  const up = trend&&trend.startsWith("+")&&!trend.startsWith("+0");
  return (
    <div className="bg-white border border-slate-200 rounded-lg p-3.5 shadow-sm">
      <div className="flex items-center justify-between"><span className="text-[11.5px] text-slate-500">{label}</span><div className={"w-7 h-7 rounded-md grid place-items-center "+tc}><Icon name={icon} size={13}/></div></div>
      <div className="flex items-baseline gap-2 mt-1">
        <div className="text-[22px] font-semibold text-slate-900 tnum">{value}</div>
        {trend && <span className={"text-[10.5px] font-medium tnum "+(up?"text-emerald-600":"text-slate-500")}>{trend}</span>}
      </div>
    </div>
  );
}
function AlertRow({ level, robot, msg, time }) {
  const c = level==="error"?{bg:"bg-rose-50",icon:"AlertOctagon",cl:"text-rose-600"}:{bg:"bg-amber-50",icon:"AlertTriangle",cl:"text-amber-600"};
  return (
    <div className="px-4 py-2.5 flex items-start gap-2.5">
      <div className={"w-7 h-7 rounded-md grid place-items-center shrink-0 "+c.bg}><Icon name={c.icon} size={13} className={c.cl}/></div>
      <div className="flex-1 min-w-0"><div className="flex items-center gap-1.5"><span className="text-[11.5px] font-semibold text-slate-900 tnum">{robot}</span><span className="text-[10.5px] text-slate-400 tnum">· {time} 전</span></div><div className="text-[11.5px] text-slate-700 mt-0.5">{msg}</div></div>
      <button className="text-[10.5px] font-medium text-blue-600">처리</button>
    </div>
  );
}
function CmdSection({ icon, tone, title, subtitle, children }) {
  const acc = {blue:{bg:"bg-blue-50",fg:"text-blue-700"},indigo:{bg:"bg-indigo-50",fg:"text-indigo-700"},emerald:{bg:"bg-emerald-50",fg:"text-emerald-700"},rose:{bg:"bg-rose-50",fg:"text-rose-700"}}[tone]||{bg:"bg-slate-50",fg:"text-slate-700"};

}

}

function BarChart({ data }) {
  const w=560,h=180,pad={l:24,r:8,t:8,b:20},max=Math.max(...data.map(d=>d[1])),bw=(w-pad.l-pad.r)/data.length;
  return <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{height:180}}>
    {[0,.5,1].map((t,i)=>{const y=pad.t+(1-t)*(h-pad.t-pad.b);return <g key={i}><line x1={pad.l} y1={y} x2={w-pad.r} y2={y} stroke="#e2e8f0" strokeDasharray="2 2"/><text x={pad.l-4} y={y+3} textAnchor="end" fill="#94a3b8" fontSize={9}>{Math.round(t*max)}</text></g>;})}
    {data.map(([l,v],i)=>{const x=pad.l+i*bw+bw*.15,bh=(v/max)*(h-pad.t-pad.b),y=h-pad.b-bh;return <g key={l}><rect x={x} y={y} width={bw*.7} height={bh} fill="#2563eb" rx="2"/><text x={x+bw*.35} y={h-pad.b+12} textAnchor="middle" fill="#94a3b8" fontSize={8}>{l}</text></g>;})}
  </svg>;
}

function RecipeBuilder({ recipeId, onBack }) {
  const initial = recipes.find(r=>r.id===recipeId);
  const [name,setName]=useState(initial?initial.name:"신규 레시피");
  const [fleet,setFleet]=useState(initial?initial.fleet:"amr");
  const [fleetOpen,setFleetOpen]=useState(false);
  const [nodes,setNodes]=useState(()=>{
    if(initial&&initial.nodes&&initial.nodes.length>0)return initial.nodes;
    if(initial)return initial.steps.map((s,i)=>({id:s.nodeId,x:120+(i%4)*160,y:140+Math.floor(i/4)*130,label:"Node "+(i+1)}));
    return[];
  });
  const [steps,setSteps]=useState(()=>initial?[...initial.steps]:[]);
  const [selIdx,setSelIdx]=useState(steps.length>0?0:null);
  const mapRef=useRef(null);
  const [mapMode,setMapMode]=useState("select");
  const [mapId,setMapId]=useState(floors[0].id);
  const [mapDropOpen,setMapDropOpen]=useState(false);
  const [dragFrom,setDragFrom]=useState(null);
  const [dragOver,setDragOver]=useState(null);
  const [tempSaves,setTempSaves]=useState([]);
  const [tempListOpen,setTempListOpen]=useState(false);

  const selStep=selIdx!==null?steps[selIdx]:null;
  const selNode=selStep?nodes.find(n=>n.id===selStep.nodeId):null;
  const totalDur=steps.reduce((s,st)=>s+(st.duration||0),0);

  function addStepForNode(node){
    if(!nodes.find(n=>n.id===node.id))setNodes(p=>[...p,node]);
    const validActs=actionTypes.filter(a=>a.fleets.includes(fleet));
    const def=validActs[0]||actionTypes[0];
    setSteps(p=>{setSelIdx(p.length);return[...p,{nodeId:node.id,actionType:def.id,duration:def.defaultDuration}];});
  }
  function removeStep(idx){
    const nodeId=steps[idx].nodeId;
    const newSteps=steps.filter((_,i)=>i!==idx);
    setSteps(newSteps);
    // 다른 스텝에서 같은 노드를 참조하지 않을 때만 nodes에서 제거
    if(!newSteps.find(s=>s.nodeId===nodeId)){
      setNodes(p=>p.filter(n=>n.id!==nodeId));
    }
    setSelIdx(null);
  }
  function updateStep(idx,patch){setSteps(p=>p.map((s,i)=>i===idx?{...s,...patch}:s));}
  function handleMapClick(e){
    if(mapMode!=="create")return;
    const rect=mapRef.current.getBoundingClientRect();
    const x=Math.round(e.clientX-rect.left),y=Math.round(e.clientY-rect.top);
    const id="N"+(nodes.length+1);
    addStepForNode({id,x,y,label:"Custom "+(nodes.length+1)});
  }
  function doTempSave(){
    const now=new Date();
    const ts=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0")+" "+String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
    setTempSaves(p=>[{id:Date.now(),name,fleet,steps:[...steps],nodes:[...nodes],savedAt:ts},...p.slice(0,19)]);
  }
  function switchMap(newMapId){
    if(steps.length>0){doTempSave();}
    setMapId(newMapId);
    setMapDropOpen(false);
  }
  function restoreTemp(t){
    setName(t.name);setFleet(t.fleet);setSteps([...t.steps]);setNodes([...t.nodes]);
    setSelIdx(null);setTempListOpen(false);
  }

  // Drag-to-reorder flow blocks
  function onBlockDragStart(e,i){setDragFrom(i);e.dataTransfer.effectAllowed="move";}
  function onBlockDragOver(e,i){e.preventDefault();if(dragFrom===null||dragFrom===i)return;setDragOver(i);}
  function onBlockDrop(e,i){
    e.preventDefault();
    if(dragFrom===null||dragFrom===i){setDragFrom(null);setDragOver(null);return;}
    const next=[...steps];const[moved]=next.splice(dragFrom,1);next.splice(i,0,moved);
    setSteps(next);setSelIdx(i);setDragFrom(null);setDragOver(null);
  }

  const currentFloor=floors.find(f=>f.id===mapId)||floors[0];

  return (
    <div className="h-full flex flex-col relative">
      {/* Top bar */}
      <div className="h-12 px-5 border-b border-slate-200 bg-white flex items-center gap-3 shrink-0">
        <button onClick={onBack} className="flex items-center gap-1 text-[12.5px] text-slate-500 hover:text-slate-900"><Icon name="ArrowLeft" size={13}/> 목록</button>
        <span className="text-slate-300">/</span>
        <span className="text-[13px] font-semibold text-slate-900 truncate max-w-[200px]">{name}</span>
        <div className="ml-auto flex items-center gap-2">
          <button onClick={doTempSave} className="h-8 px-3 rounded-md border border-slate-200 bg-white hover:bg-slate-50 text-[12.5px] font-medium text-slate-700 flex items-center gap-1.5">
            <Icon name="Clock" size={12}/> 임시저장
          </button>
          <button className="h-8 px-3.5 rounded-md bg-blue-600 hover:bg-blue-700 text-white text-[12.5px] font-medium flex items-center gap-1.5">
            <Icon name="Save" size={12}/> Save
          </button>
        </div>
      </div>

      <div className="flex-1 min-h-0 grid" style={{gridTemplateColumns:"260px 1fr"}}>
        {/* Left panel */}
        <div className="border-r border-slate-200 bg-white overflow-y-auto">

          {/* 1. 레시피명 */}
          <div className="p-4 border-b border-slate-200">
            <div className="text-[11px] font-medium text-slate-400 uppercase tracking-wider mb-1.5">레시피명</div>
            <input value={name} onChange={e=>setName(e.target.value)}
              placeholder="레시피 이름 입력"
              className="h-9 px-2.5 w-full rounded-md border border-slate-200 bg-white text-[13px] font-medium text-slate-900 outline-none focus:border-blue-400 placeholder:text-slate-300 placeholder:font-normal"/>
          </div>

          {/* 2. 대상 Fleet — 드롭다운 */}
          <div className="p-4 border-b border-slate-200">
            <div className="text-[11px] font-medium text-slate-400 uppercase tracking-wider mb-1.5">대상 Fleet</div>
            <div className="relative">
              <button onClick={()=>setFleetOpen(o=>!o)}
                className={"h-9 w-full pl-3 pr-8 rounded-md border bg-white flex items-center gap-2 text-[12.5px] font-medium transition "+(fleetOpen?"border-blue-400 ring-2 ring-blue-100":"border-slate-200 hover:border-slate-300")}>
                <span className="w-2 h-2 rounded-full shrink-0" style={{background:fleets.find(f=>f.id===fleet)?.color}}/>
                <span className="text-slate-900">{fleets.find(f=>f.id===fleet)?.name}</span>
                <Icon name="ChevronDown" size={12} className={"ml-auto text-slate-400 transition-transform "+(fleetOpen?"rotate-180":"")}/>
              </button>
              {fleetOpen&&<>
                <div className="fixed inset-0 z-10" onClick={()=>setFleetOpen(false)}/>
                <div className="absolute z-20 top-full mt-1 left-0 right-0 bg-white rounded-lg shadow-xl border border-slate-200 py-1 overflow-hidden">
                  {fleets.map(f=>(
                    <button key={f.id} onClick={()=>{setFleet(f.id);setFleetOpen(false);}}
                      className={"w-full flex items-center gap-2.5 px-3 py-2 hover:bg-blue-50 "+(f.id===fleet?"bg-blue-50":"")}>
                      <span className="w-2 h-2 rounded-full shrink-0" style={{background:f.color}}/>
                      <span className={"text-[12.5px] flex-1 "+(f.id===fleet?"text-blue-700 font-semibold":"text-slate-700")}>{f.name}</span>
                      {f.id===fleet&&<Icon name="Check" size={12} className="text-blue-600"/>}
                    </button>
                  ))}
                </div>
              </>}
            </div>
          </div>

          {/* 3. 선택된 노드 */}
          <div className="p-4 border-b border-slate-200">
            <div className="text-[11px] font-medium text-slate-400 uppercase tracking-wider mb-2">선택된 노드</div>
            {!selNode
              ? <div className="rounded-md bg-slate-50 border border-dashed border-slate-200 p-3 text-center"><Icon name="MousePointerClick" size={16} className="text-slate-400 mx-auto mb-1"/><p className="text-[11.5px] text-slate-500">맵에서 노드를 클릭하여<br/>단계로 추가하세요</p></div>
              : <div className="rounded-md border border-slate-200 bg-slate-50/40 p-3">
                  <div className="flex items-center gap-2 mb-2">
                    <div className="w-7 h-7 rounded-full bg-blue-600 text-white grid place-items-center text-[11px] font-semibold">{selIdx+1}</div>
                    <div className="text-[12.5px] font-medium text-slate-900">{selNode.label}</div>
                    <button onClick={()=>removeStep(selIdx)} className="ml-auto w-6 h-6 grid place-items-center rounded hover:bg-rose-50 text-slate-400 hover:text-rose-500"><Icon name="Trash2" size={12}/></button>
                  </div>
                  <input value={selNode.label} onChange={e=>setNodes(p=>p.map(n=>n.id===selNode.id?{...n,label:e.target.value}:n))}
                    className="w-full h-7 px-2 rounded border border-slate-200 bg-white text-[11.5px] outline-none focus:border-blue-400"/>
                </div>
            }
          </div>

          {/* 4. Action Type */}
          <div className="p-4">
            <div className="text-[11px] font-medium text-slate-400 uppercase tracking-wider mb-2">Action Type</div>
            <div className="grid grid-cols-2 gap-1.5">
              {actionTypes.filter(a=>a.fleets.includes(fleet)).map(a=>{
                const isA=selStep&&selStep.actionType===a.id;
                return (
                  <button key={a.id} disabled={!selStep} onClick={()=>updateStep(selIdx,{actionType:a.id,duration:a.defaultDuration*10})}
                    className={"h-14 rounded-md border flex flex-col items-center justify-center gap-1 transition "+(!selStep?"opacity-40 cursor-not-allowed border-slate-200":"")+(isA?" border-blue-500 bg-blue-50":" border-slate-200 bg-white hover:bg-slate-50")}>
                    <Icon name={a.icon} size={15} style={{color:a.color}}/><span className="text-[10.5px] font-medium text-slate-700">{a.label}</span>
                  </button>
                );
              })}
            </div>
            {/* Duration — 초 단위 text input */}
            {selStep&&(
              <div className="mt-4">
                <div className="text-[11px] font-medium text-slate-400 uppercase tracking-wider mb-1.5">소요 시간 (초)</div>
                <div className="flex items-center gap-2">
                  <input
                    type="text"
                    inputMode="numeric"
                    value={selStep.duration}
                    onChange={e=>{const v=e.target.value.replace(/[^0-9]/g,"");updateStep(selIdx,{duration:v===""?0:+v});}}
                    className="flex-1 h-9 px-3 rounded-md border border-slate-200 bg-white text-[13px] font-semibold text-slate-900 outline-none focus:border-blue-400 tnum"
                    placeholder="0"
                  />
                  <span className="text-[12px] text-slate-500 font-medium shrink-0">초</span>
                </div>
              </div>
            )}
          </div>
        </div>

        {/* Right: Map + Flow */}
        <div className="min-w-0 flex flex-col">
          <div className="relative flex-1 min-h-0 overflow-hidden bg-slate-50">
            {/* Map dropdown — top left */}
            <div className="absolute top-3 left-3 z-20 flex items-center gap-1.5">
              <div className="relative">
                <button onClick={()=>setMapDropOpen(o=>!o)}
                  className={"h-8 pl-3 pr-2 flex items-center gap-2 rounded-md border bg-white shadow-sm text-[12px] font-medium transition "+(mapDropOpen?"border-blue-400 ring-2 ring-blue-100":"border-slate-200 hover:border-slate-300")}>
                  <Icon name="Map" size={12} className="text-slate-500"/>
                  <span className="text-slate-800">{currentFloor.label}</span>
                  <Icon name="ChevronDown" size={11} className={"text-slate-400 ml-1 transition-transform "+(mapDropOpen?"rotate-180":"")}/>
                </button>
                {mapDropOpen&&<>
                  <div className="fixed inset-0 z-10" onClick={()=>setMapDropOpen(false)}/>
                  <div className="absolute z-20 top-full mt-1 left-0 w-[240px] bg-white rounded-lg shadow-xl border border-slate-200 py-1 overflow-hidden">

                      <button key={f.id} onClick={()=>switchMap(f.id)}
                        className={"w-full flex items-center gap-2.5 px-3 py-2 text-left hover:bg-blue-50 "+(f.id===mapId?"bg-blue-50":"")}>

/* ══════════════════════════════════════════
   SCHEDULER (GANTT)

const GANTT = { startHour:6, endHour:20, pxPerMin:2.4, rowH:56, BUFFER:5 };
const GW = (GANTT.endHour-GANTT.startHour)*60*GANTT.pxPerMin;
const RCOL = 168;
const SC = {
  done:   {bg:"bg-slate-100",border:"border-slate-300",fg:"text-slate-700",label:"완료",chip:"#94a3b8"},
  running:{bg:"bg-blue-100", border:"border-blue-400", fg:"text-blue-900", label:"진행중",chip:"#2563eb"},
  queued: {bg:"bg-amber-50", border:"border-amber-300",fg:"text-amber-900",label:"예약",chip:"#d97706"},
  error:  {bg:"bg-rose-100", border:"border-rose-400", fg:"text-rose-900", label:"실패",chip:"#e11d48"},
};

function computePlacement(allOrders, robotId, desiredStart, duration, ignoreId) {
  const row = allOrders.filter(o=>o.robotId===robotId&&o.id!==ignoreId);
  let start=desiredStart, safety=0, conflict=false;
  while(safety++<100){
    const end=start+duration;
    const blocker=row.find(o=>{const dur=recipeDuration(recipes.find(r=>r.id===o.recipeId));const os=o.start-GANTT.BUFFER,oe=o.start+dur+GANTT.BUFFER;return start<oe&&end>os;});
    if(!blocker)break;
    conflict=true;
    const dur=recipeDuration(recipes.find(r=>r.id===blocker.recipeId));
    start=blocker.start+dur+GANTT.BUFFER;
  }
  return {start,conflict};
}

    onChange(n);
  };
  const label = allSelected

  return (

            </button>

            <div className="h-px bg-slate-100 my-1"/>

                  key={f.id}
                  onClick={() => toggle(f.id)}

                >
                  <div className={"w-4 h-4 rounded border-2 grid place-items-center shrink-0 transition-colors " + (on ? "border-blue-500 bg-blue-500" : "border-slate-300")}>

function SchedulerView({ initialFocusRecipeId }) {
  const [orders,setOrders]=useState(initOrders.map(o=>({...o})));
  const [selOrder,setSelOrder]=useState(null);
  const [draggingRcp,setDraggingRcp]=useState(null);
  const [hoverPrev,setHoverPrev]=useState(null);
  const [libOpen,setLibOpen]=useState(true);
  const [now,setNow]=useState(11*60+12);
  const [hlRcp,setHlRcp]=useState(initialFocusRecipeId||null);
  const [addOpen,setAddOpen]=useState(false);
  const [fleetF,setFleetF]=useState(new Set());
  const [libQ,setLibQ]=useState("");
  const [libFleetF,setLibFleetF]=useState(new Set());
  const [moving,setMoving]=useState(null);
  const [schedDate,setSchedDate]=useState("2026-05-13");
  const [schedMapId,setSchedMapId]=useState(floors[0].id);
  const [schedMapOpen,setSchedMapOpen]=useState(false);
  const pressRef=useRef(null);
  const lastDragRef=useRef(0);
  const ganttRef=useRef(null);
  const headRef=useRef(null);
  const rColRef=useRef(null);

  const allR=robots;
  const visR=fleetF.size===0?allR:allR.filter(r=>fleetF.has(r.fleet));

  useEffect(()=>{const id=setInterval(()=>setNow(n=>n+1),8000);return()=>clearInterval(id);},[]);
  useEffect(()=>{
    const g=ganttRef.current,h=headRef.current;if(!g||!h)return;
    const fn=()=>{h.scrollLeft=g.scrollLeft;if(rColRef.current)rColRef.current.scrollTop=g.scrollTop;};
    g.addEventListener("scroll",fn);return()=>g.removeEventListener("scroll",fn);
  },[]);

  function timeFromX(clientX){
    const rect=ganttRef.current.getBoundingClientRect();
    const x=clientX-rect.left+ganttRef.current.scrollLeft;
    const min=GANTT.startHour*60+x/GANTT.pxPerMin;
    return Math.max(GANTT.startHour*60,Math.min(GANTT.endHour*60,Math.round(min/5)*5));
  }
  function onLibDragStart(e,rId){setDraggingRcp(rId);e.dataTransfer.setData("text/plain",rId);e.dataTransfer.effectAllowed="copy";}
  function onRowDragOver(e,rId){
    e.preventDefault();if(!draggingRcp)return;
    const r=recipes.find(r=>r.id===draggingRcp);if(!r)return;
    const dur=recipeDuration(r),start=timeFromX(e.clientX);
    const p=computePlacement(orders,rId,start,dur,null);
    setHoverPrev({robotId:rId,start:p.start,duration:dur,recipeId:r.id,conflict:p.conflict});
  }
  function onRowDrop(e,rId){
    e.preventDefault();if(!draggingRcp)return;
    const r=recipes.find(r=>r.id===draggingRcp);if(!r)return;
    const dur=recipeDuration(r),start=timeFromX(e.clientX);
    const p=computePlacement(orders,rId,start,dur,null);
    setOrders(o=>[...o,{id:"ord-"+(1000+o.length),robotId:rId,recipeId:r.id,start:p.start,status:"queued"}]);
    setDraggingRcp(null);setHoverPrev(null);
  }
  function isEditable(o){return o.status==="queued"&&o.start>now;}
  function copyOrder(o){
    const r=recipes.find(rr=>rr.id===o.recipeId);if(!r)return;
    const dur=recipeDuration(r),p=computePlacement(orders,o.robotId,o.start+dur+GANTT.BUFFER,dur,null);
    setOrders(oo=>[...oo,{id:"ord-"+(1000+oo.length+Math.floor(Math.random()*99)),robotId:o.robotId,recipeId:o.recipeId,start:p.start,status:"queued"}]);
    setSelOrder(null);
  }
  function deleteOrder(o){setOrders(oo=>oo.filter(x=>x.id!==o.id));setSelOrder(null);}
  function onBlockMouseDown(e,o){
    if(e.button!==0||!isEditable(o))return;
    const r=recipes.find(rr=>rr.id===o.recipeId);if(!r)return;
    const dur=recipeDuration(r);
    pressRef.current={orderId:o.id,robotId:o.robotId,startX:e.clientX,origStart:o.start,duration:dur,moved:false};
    const onMove=ev=>{const p=pressRef.current;if(!p)return;const dx=ev.clientX-p.startX;if(!p.moved&&Math.abs(dx)<4)return;p.moved=true;const dt=Math.round(dx/GANTT.pxPerMin/5)*5,desired=Math.max(now,p.origStart+dt);const pl=computePlacement(orders,p.robotId,desired,p.duration,p.orderId);setMoving({orderId:p.orderId,robotId:p.robotId,ghostStart:pl.start,conflict:pl.conflict});};
    const onUp=ev=>{const p=pressRef.current;window.removeEventListener("mousemove",onMove);window.removeEventListener("mouseup",onUp);if(p&&p.moved){const dx=ev.clientX-p.startX,dt=Math.round(dx/GANTT.pxPerMin/5)*5,desired=Math.max(now,p.origStart+dt);const pl=computePlacement(orders,p.robotId,desired,p.duration,p.orderId);setOrders(oo=>oo.map(x=>x.id===p.orderId?{...x,start:pl.start}:x));lastDragRef.current=Date.now();}pressRef.current=null;setMoving(null);};
    window.addEventListener("mousemove",onMove);window.addEventListener("mouseup",onUp);e.preventDefault();
  }

  return (
    <div className="h-full flex flex-col bg-slate-50">
      {/* Sub-header */}
      <div className="h-12 px-5 border-b border-slate-200 bg-white flex items-center gap-2">
        {/* 날짜 선택 */}
        <div className="relative flex items-center gap-1.5">
          <Icon name="CalendarRange" size={14} className="text-slate-500"/>
          <div className="relative">
            <input
              type="date"
              value={schedDate}
              onChange={e=>setSchedDate(e.target.value)}
              className="h-8 pl-2 pr-2 rounded-md border border-slate-200 bg-white text-[13px] font-semibold text-slate-900 outline-none focus:border-blue-400 cursor-pointer"
            />
          </div>
        </div>

        <div className="h-5 w-px bg-slate-200"/>

        {/* 맵 선택 드랍다운 */}
        <div className="relative">

        <span className="w-2 h-2 rounded-full shrink-0" style={{background:current?.color}}/>
        <span className="text-slate-900">{current?.name}</span>
        <Icon name="ChevronDown" size={12} className={"ml-auto text-slate-400 transition-transform "+(open?"rotate-180":"")}/>
      </button>
      {open&&<>
        <div className="fixed inset-0 z-10" onClick={()=>setOpen(false)}/>
        <div className="absolute z-20 top-full mt-1 left-0 right-0 bg-white rounded-lg shadow-xl border border-slate-200 py-1 overflow-hidden">
          {fleets.map(f=>(
            <button key={f.id} onClick={()=>{onChange(f.id);setOpen(false);}}
              className={"w-full flex items-center gap-2.5 px-3 py-2 hover:bg-blue-50 "+(f.id===value?"bg-blue-50":"")}>
              <span className="w-2 h-2 rounded-full shrink-0" style={{background:f.color}}/>
              <span className={"text-[12.5px] flex-1 "+(f.id===value?"text-blue-700 font-semibold":"text-slate-700")}>{f.name}</span>
              {f.id===value&&<Icon name="Check" size={12} className="text-blue-600"/>}

        </div>
      </>}
    </div>
  );
}

function AddOrderDialog({ orders, onClose, onCreate }) {
  const today=new Date();
  const todayStr=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
  const [fleet,setFleet]=useState("amr");
  const fr=recipes.filter(r=>r.fleet===fleet);
  const rb=robots.filter(r=>r.fleet===fleet);
  const [recipeId,setRecipeId]=useState(fr[0]?.id||"");
  const [robotId,setRobotId]=useState(rb[0]?.id||"");
  const [date,setDate]=useState(todayStr);
  const [hour,setHour]=useState(13);
  const [minute,setMinute]=useState(0);
  const [repeat,setRepeat]=useState(false);
  const [repeatDays,setRepeatDays]=useState(new Set());
  useEffect(()=>{const rs=recipes.filter(r=>r.fleet===fleet),rbs=robots.filter(r=>r.fleet===fleet);if(!rs.find(r=>r.id===recipeId))setRecipeId(rs[0]?.id||"");if(!rbs.find(r=>r.id===robotId))setRobotId(rbs[0]?.id||"");},[fleet]);
  const recipe=recipes.find(r=>r.id===recipeId);
  const dur=recipe?recipeDuration(recipe):0;
  const desired=hour*60+minute;
  const placement=recipe&&robotId?computePlacement(orders,robotId,desired,dur,null):{start:desired,conflict:false};
  const shifted=placement.conflict&&placement.start!==desired;
  const DAYS=[{id:0,label:"일"},{id:1,label:"월"},{id:2,label:"화"},{id:3,label:"수"},{id:4,label:"목"},{id:5,label:"금"},{id:6,label:"토"}];
  const toggleDay=d=>{const n=new Set(repeatDays);n.has(d)?n.delete(d):n.add(d);setRepeatDays(n);};
  const dayLabel=DAYS.filter(d=>repeatDays.has(d.id)).map(d=>d.label).join("·");
  const presetLabel=repeatDays.size===7?" (매일)":(!repeatDays.has(0)&&!repeatDays.has(6)&&repeatDays.size===5)?" (평일)":(repeatDays.has(0)&&repeatDays.has(6)&&repeatDays.size===2)?" (주말)":"";
  return (
    <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm grid place-items-center p-4" onClick={onClose}>
      <div className="w-[540px] bg-white rounded-xl shadow-2xl border border-slate-200 overflow-hidden" onClick={e=>e.stopPropagation()}>
        <div className="h-12 px-5 border-b border-slate-200 flex items-center gap-2">
          <div className="w-7 h-7 rounded-md bg-blue-50 grid place-items-center text-blue-600"><Icon name="CalendarPlus" size={14}/></div>
          <h3 className="text-[14px] font-semibold text-slate-900">새 작업 추가</h3>
          <button onClick={onClose} className="ml-auto w-7 h-7 grid place-items-center rounded hover:bg-slate-100 text-slate-500"><Icon name="X" size={14}/></button>
        </div>
        <div className="p-5 space-y-4 overflow-y-auto" style={{maxHeight:"72vh"}}>
          {/* Fleet */}
          <div>
            <div className="text-[11px] font-medium text-slate-500 mb-1">Fleet 선택</div>
            <AddFleetDropdown value={fleet} onChange={setFleet}/>
          </div>
          {/* Recipe + Robot */}
          <div className="grid grid-cols-2 gap-3">
            <div><div className="text-[11px] font-medium text-slate-500 mb-1">레시피</div><div className="relative"><select value={recipeId} onChange={e=>setRecipeId(e.target.value)} className="h-9 pl-3 pr-8 w-full rounded-md border border-slate-200 bg-white text-[12.5px] text-slate-800 outline-none focus:border-blue-400 appearance-none">{fr.map(r=><option key={r.id} value={r.id}>{r.name}·{recipeDuration(r)}분</option>)}</select><Icon name="ChevronDown" size={12} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/></div></div>
            <div><div className="text-[11px] font-medium text-slate-500 mb-1">할당 로봇</div><div className="relative"><select value={robotId} onChange={e=>setRobotId(e.target.value)} className="h-9 pl-3 pr-8 w-full rounded-md border border-slate-200 bg-white text-[12.5px] text-slate-800 outline-none focus:border-blue-400 appearance-none">{rb.map(r=><option key={r.id} value={r.id}>{r.id}</option>)}</select><Icon name="ChevronDown" size={12} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/></div></div>
          </div>
          {/* Date + Time */}
          <div>
            <div className="text-[11px] font-medium text-slate-500 mb-1">날짜 · 시작 시간</div>
            <div className="grid grid-cols-3 gap-2">
              <div className="relative">
                <Icon name="Calendar" size={12} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none z-10"/>
                <input type="date" value={date} onChange={e=>setDate(e.target.value)} className="h-9 pl-7 pr-2 w-full rounded-md border border-slate-200 bg-white text-[12px] text-slate-800 outline-none focus:border-blue-400 cursor-pointer"/>
              </div>
              <div className="relative"><select value={hour} onChange={e=>setHour(+e.target.value)} className="h-9 pl-3 pr-8 w-full rounded-md border border-slate-200 bg-white text-[12.5px] text-slate-800 outline-none appearance-none">{Array.from({length:24},(_,i)=><option key={i} value={i}>{String(i).padStart(2,"0")}시</option>)}</select><Icon name="ChevronDown" size={12} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/></div>
              <div className="relative"><select value={minute} onChange={e=>setMinute(+e.target.value)} className="h-9 pl-3 pr-8 w-full rounded-md border border-slate-200 bg-white text-[12.5px] text-slate-800 outline-none appearance-none">{[0,5,10,15,20,25,30,35,40,45,50,55].map(m=><option key={m} value={m}>{String(m).padStart(2,"0")}분</option>)}</select><Icon name="ChevronDown" size={12} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/></div>
            </div>
          </div>
          {/* Repeat */}
          <div>
            <div className="flex items-center justify-between mb-2">
              <div className="text-[11px] font-medium text-slate-500">반복 설정</div>
              <button onClick={()=>{setRepeat(o=>!o);if(repeat)setRepeatDays(new Set());}}
                className={"h-8 px-3 rounded-lg text-[12px] font-medium border transition flex items-center gap-2 "+(repeat?"border-blue-500 bg-blue-50 text-blue-700":"border-slate-200 bg-white text-slate-600 hover:bg-slate-50")}>
                <div className={"w-8 h-4 rounded-full relative transition-all duration-200 "+(repeat?"bg-blue-500":"bg-slate-300")}>
                  <div className={"absolute top-0.5 w-3 h-3 rounded-full bg-white shadow transition-all duration-200 "+(repeat?"left-4":"left-0.5")}/>
                </div>
                <Icon name="Repeat" size={12}/>
                반복 {repeat?"켜짐":"꺼짐"}
              </button>
            </div>
            {repeat && (
              <div className="rounded-lg border border-blue-200 bg-blue-50/40 p-3">
                <div className="text-[10.5px] font-semibold text-blue-600 uppercase tracking-wider mb-2.5 flex items-center gap-1.5">
                  <Icon name="CalendarDays" size={11}/> 반복 요일 선택
                </div>
                <div className="flex items-center gap-1.5">
                  {DAYS.map(d=>{
                    const on=repeatDays.has(d.id);
                    const isSun=d.id===0,isSat=d.id===6;
                    return (
                      <button key={d.id} onClick={()=>toggleDay(d.id)}
                        className={"flex-1 h-10 rounded-lg text-[13px] font-bold border-2 transition-all "+(
                          on ? isSun?"border-rose-400 bg-rose-500 text-white shadow-sm"
                             : isSat?"border-blue-400 bg-blue-500 text-white shadow-sm"
                             : "border-slate-700 bg-slate-800 text-white shadow-sm"
                          : "border-slate-200 bg-white text-slate-500 hover:border-slate-300 hover:bg-slate-50"
                        )}>
                        {d.label}
                      </button>
                    );
                  })}
                </div>
                <div className="mt-2 h-5 flex items-center">
                  {repeatDays.size>0 ? (
                    <div className="flex items-center gap-1.5 text-[10.5px] text-blue-600">
                      <Icon name="Check" size={10}/>
                      <span className="font-medium">{dayLabel}{presetLabel} 반복</span>
                    </div>
                  ) : (
                    <div className="flex items-center gap-1 text-[10.5px] text-slate-400">
                      <Icon name="Info" size={10}/> 요일을 하나 이상 선택해주세요
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
          {/* Preview */}
          {recipe&&robotId&&(
            <div className={"rounded-md border p-3 "+(shifted?"border-amber-300 bg-amber-50":"border-blue-200 bg-blue-50/60")}>
              <div className="flex items-center gap-2 text-[11.5px]">
                <Icon name={shifted?"AlertTriangle":"Sparkles"} size={12} className={shifted?"text-amber-600":"text-blue-600"}/>
                <span className={"font-semibold "+(shifted?"text-amber-900":"text-blue-900")}>{shifted?"충돌 회피 적용됨":"스케줄 가능"}</span>
                <span className="ml-auto text-slate-500 tnum">{robotId}·{fmtTime(placement.start)}—{fmtTime(placement.start+dur)}</span>
              </div>
              {repeat&&repeatDays.size>0&&(
                <div className="mt-1.5 text-[10.5px] text-blue-600 flex items-center gap-1.5">
                  <Icon name="Repeat" size={10}/>
                  <span>{dayLabel}{presetLabel} · 매주 반복 예약</span>
                </div>
              )}
            </div>
          )}
        </div>
        <div className="h-14 px-5 border-t border-slate-200 bg-slate-50/50 flex items-center gap-2">
          {repeat&&repeatDays.size>0&&<div className="text-[10.5px] text-blue-600 flex items-center gap-1"><Icon name="Repeat" size={11}/>{repeatDays.size}개 요일 반복</div>}
          <button onClick={onClose} className="ml-auto h-9 px-3.5 rounded-md border border-slate-200 bg-white hover:bg-slate-50 text-[12.5px] font-medium text-slate-700">취소</button>
          <button onClick={()=>{if(!recipeId||!robotId)return;if(repeat&&repeatDays.size===0)return;onCreate({recipeId,robotId,start:placement.start,date,repeat,repeatDays:[...repeatDays]});}}
            disabled={!recipeId||!robotId||(repeat&&repeatDays.size===0)}
            className="h-9 px-4 rounded-md bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white text-[12.5px] font-medium flex items-center gap-1.5 shadow-sm">
            <Icon name="Send" size={13}/> {repeat?"반복 스케줄 생성":"생성"}
          </button>
        </div>
      </div>
    </div>
  );
}
/* ══════════════════════════════════════════
   LOGS
══════════════════════════════════════════ */
function LogsView() {
  const [filter,setFilter]=useState("all");
  const filtered=logs.filter(l=>filter==="all"||l.level===filter);
  return (
    <div className="h-full flex flex-col bg-slate-50">
      <div className="h-12 px-5 border-b border-slate-200 bg-white flex items-center gap-3">
        <Icon name="ScrollText" size={14} className="text-slate-500"/>
        <span className="text-[13.5px] font-semibold text-slate-900">시스템 로그</span>
        <div className="ml-2 flex items-center gap-1">
          {[{id:"all",label:"전체",count:logs.length},{id:"info",label:"Info",count:logs.filter(l=>l.level==="info").length},{id:"warn",label:"Warn",count:logs.filter(l=>l.level==="warn").length},{id:"error",label:"Error",count:logs.filter(l=>l.level==="error").length}].map(t=>(
            <button key={t.id} onClick={()=>setFilter(t.id)} className={"h-7 px-2.5 rounded text-[11.5px] font-medium flex items-center gap-1.5 "+(filter===t.id?"bg-slate-100 text-slate-900":"text-slate-600 hover:bg-slate-100/60")}>{t.label}<span className="text-slate-400 tnum">{t.count}</span></button>
          ))}
        </div>
        <div className="ml-auto flex items-center gap-2">
          <div className="relative"><Icon name="Search" size={12} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400"/><input placeholder="로봇 ID, 메시지 검색" className="h-8 pl-7 pr-3 rounded-md border border-slate-200 bg-white text-[12px] w-56 outline-none focus:border-blue-400"/></div>
          <button className="h-8 px-3 rounded-md border border-slate-200 bg-white hover:bg-slate-50 text-[12.5px] font-medium text-slate-700 flex items-center gap-1.5"><Icon name="Download" size={13}/> CSV</button>
        </div>
      </div>
      <div className="flex-1 overflow-auto p-5">
        <div className="bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden">
          <table className="w-full text-[12px]">
            <thead><tr className="text-left text-[11px] text-slate-500 border-b border-slate-200"><th className="font-medium px-4 py-2.5 w-24">시각</th><th className="font-medium py-2.5 w-20">레벨</th><th className="font-medium py-2.5 w-28">소스</th><th className="font-medium py-2.5">메시지</th></tr></thead>
            <tbody>
              {filtered.map((l,i)=>{const lc=l.level==="error"?"text-rose-600 bg-rose-50":l.level==="warn"?"text-amber-700 bg-amber-50":"text-slate-600 bg-slate-100";return(
                <tr key={i} className="border-b border-slate-100 hover:bg-slate-50/50">
                  <td className="px-4 py-2 font-mono text-[11px] text-slate-500 tnum">{l.ts}</td>
                  <td className="py-2"><span className={"inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-semibold uppercase tracking-wider "+lc}>{l.level}</span></td>
                  <td className="py-2 font-mono text-[11px] text-slate-700">{l.robot}</td>
                  <td className="py-2 text-slate-800">{l.msg}</td>
                </tr>
              );})}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   ROOT APP
══════════════════════════════════════════ */
function App() {
  useEffect(()=>{const el=document.createElement("style");el.textContent=CSS;document.head.appendChild(el);return()=>document.head.removeChild(el);},[]);
  const [active,setActive]=useState("schedule");
  const [cmdOpen,setCmdOpen]=useState(false);
  const [focusRcp,setFocusRcp]=useState(null);

  useEffect(()=>{
    const fn=e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();setCmdOpen(o=>!o);}else if(e.key==="Escape")setCmdOpen(false);};
    window.addEventListener("keydown",fn);return()=>window.removeEventListener("keydown",fn);
  },[]);

  function handleJump({view,payload}){
    if(view==="schedule"&&payload?.focusRecipeId){setFocusRcp(payload.focusRecipeId);setTimeout(()=>setFocusRcp(null),4500);}
    setActive(view);
  }
  const activeMeta=NAV.find(n=>n.id===active);
  return (
    <div className="h-screen w-screen flex bg-slate-50 overflow-hidden">
      <Sidebar active={active} onChange={setActive}/>
      <div className="flex-1 min-w-0 flex flex-col">
        <Header activeLabel={activeMeta?.label||""} onOpenCmd={()=>setCmdOpen(true)}/>
        <main className="flex-1 min-h-0">
          {active==="home"     &&<MonitoringHome/>}
          {active==="analytics"&&<AnalyticsView/>}
          {active==="basis"    &&<BasisView/>}
          {active==="recipe"   &&<RecipeView/>}
          {active==="schedule" &&<SchedulerView initialFocusRecipeId={focusRcp}/>}
          {active==="logs"     &&<LogsView/>}
        </main>
      </div>
      <CommandPalette open={cmdOpen} onClose={()=>setCmdOpen(false)} onJump={handleJump}/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
