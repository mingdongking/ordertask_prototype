function BarChart({ data }) {
  const w=560,h=180,pad={l:24,r:8,t:8,b:20},max=Math.max(...data.map(d=>d[1])),bw=(w-pad.l-pad.r)/data.length;
  return <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{height:180}}>
    {[0,.5,1].map((t,i)=>{const y=pad.t+(1-t)*(h-pad.t-pad.b);return <g key={i}><line x1={pad.l} y1={y} x2={w-pad.r} y2={y} stroke="#e2e8f0" strokeDasharray="2 2"/><text x={pad.l-4} y={y+3} textAnchor="end" fill="#94a3b8" fontSize={9}>{Math.round(t*max)}</text></g>;})}
    {data.map(([l,v],i)=>{const x=pad.l+i*bw+bw*.15,bh=(v/max)*(h-pad.t-pad.b),y=h-pad.b-bh;return <g key={l}><rect x={x} y={y} width={bw*.7} height={bh} fill="#2563eb" rx="2"/><text x={x+bw*.35} y={h-pad.b+12} textAnchor="middle" fill="#94a3b8" fontSize={8}>{l}</text></g>;})}
  </svg>;
}

  const [sortDir,setSortDir]=useState("asc");

  // 상태 우선순위 (오류 최우선)
  const STATUS_PRIORITY = { down:0, disconnect:1, manual:2, charge:3, run:4, idle:5 };

  const isFiltered = fleetF.size>0 || statusF!=="all" || q!=="";

  function resetFilters(){ setFleetF(new Set()); setStatusF("all"); setQ(""); }

  // 로봇 목 데이터 (모니터링 홈 기반 + 추가 정보)
  const robotData = [
    {id:"Tool001", fleet:"amr", status:"run",        battery:82, speed:0.8, task:"PICK-2041",  recipe:"A동→B동 자재이송",  uptime:"14h 22m", lastSeen:"13:42:08", x:280,y:130},
    {id:"Tool002", fleet:"amr", status:"run",        battery:64, speed:0.6, task:"MOVE-2042",  recipe:"QC 라인 검수 순회", uptime:"12h 05m", lastSeen:"13:42:05", x:420,y:200},
    {id:"Tool003", fleet:"amr", status:"idle",       battery:95, speed:0.0, task:null,         recipe:null,                uptime:"08h 10m", lastSeen:"13:41:55", x:140,y:230},
    {id:"Tool004", fleet:"amr", status:"charge",     battery:31, speed:0.0, task:"CHARGE",     recipe:"충전 스테이션 복귀", uptime:"06h 50m", lastSeen:"13:42:01", x:150,y:370},
    {id:"Ride001", fleet:"agv", status:"run",        battery:71, speed:0.5, task:"TRANS-1102", recipe:"AGV 라인 보충",     uptime:"10h 33m", lastSeen:"13:42:07", x:640,y:160},
    {id:"Ride002", fleet:"agv", status:"down",       battery:58, speed:0.0, task:"TRANS-1103", recipe:"AGV 라인 보충",     uptime:"03h 22m", lastSeen:"13:40:12", x:580,y:220},
    {id:"Part001", fleet:"arm", status:"manual",     battery:88, speed:0.0, task:"ASSY-9001",  recipe:"팔레트 적재 시퀀스", uptime:"11h 14m", lastSeen:"13:42:03", x:480,y:380},
    {id:"Part002", fleet:"arm", status:"disconnect", battery:90, speed:0.0, task:null,         recipe:null,                uptime:"00h 00m", lastSeen:"13:28:38", x:540,y:380},
    {id:"x001",fleet:"semi",status:"run",        battery:76, speed:0.3, task:"WAFER-2201", recipe:"웨이퍼 핸들링",     uptime:"09h 45m", lastSeen:"13:42:06", x:720,y:360},
    {id:"x002",fleet:"semi",status:"idle",       battery:92, speed:0.0, task:null,         recipe:null,                uptime:"07h 30m", lastSeen:"13:41:50", x:780,y:360},
  ];

  const filtered = robotData.filter(r=>{
    if(fleetF.size>0 && !fleetF.has(r.fleet)) return false;
    if(statusF!=="all"&&r.status!==statusF) return false;
    if(q&&!r.id.toLowerCase().includes(q.toLowerCase())&&!(r.task||"").toLowerCase().includes(q.toLowerCase())) return false;
    return true;
  }).sort((a,b)=>{
    // status 정렬: 오류 우선
    if(sortBy==="status"){
      const diff = STATUS_PRIORITY[a.status] - STATUS_PRIORITY[b.status];
      return diff * (sortDir==="asc"?1:-1);
    }
    const v = sortDir==="asc"?1:-1;
    if(sortBy==="battery") return (a.battery-b.battery)*v;
    if(sortBy==="uptime") return a.uptime.localeCompare(b.uptime)*v;
    // 기본 id 정렬 시에도 오류 먼저
    const statusDiff = STATUS_PRIORITY[a.status] - STATUS_PRIORITY[b.status];
    if(statusDiff!==0) return statusDiff;
    return a[sortBy].localeCompare(b[sortBy])*v;
  });

  function toggleSort(col){ if(sortBy===col) setSortDir(d=>d==="asc"?"desc":"asc"); else {setSortBy(col);setSortDir("asc");} }

  const statusCounts = Object.fromEntries(statuses.map(s=>[s.id,robotData.filter(r=>r.status===s.id).length]));

        <div className="text-[11.5px] text-slate-400 flex items-center gap-1.5">

        {statuses.map(s=>(

            <div className="flex items-center justify-between mb-1.5">
              
              <span className="text-[18px] font-bold tnum" style={{color:statusF===s.id?s.fg:"#0f172a"}}>{statusCounts[s.id]||0}</span>
            </div>
            <div className="text-[11px] font-medium" style={{color:statusF===s.id?s.fg:"#64748b"}}>{s.label}</div>
          </button>
        ))}
      </div>

      {/* 테이블 카드 */}
      <div className="bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden">

          <div className="relative">
            <Icon name="Search" size={12} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400"/>

// 시간대별 처리량 (24h 목 데이터)
const HOURLY = {
  amr:  [4,2,3,1,2,5,12,18,24,28,32,26,18,25,30,28,22,19,14,10,8,6,5,4],
  agv:  [2,1,2,1,1,3, 8,12,16,20,22,18,12,16,20,18,14,12, 8, 6,4,3,2,2],
  arm:  [1,1,1,0,1,2, 5, 8,10,12,14,12, 8,10,12,11, 9, 8, 5, 4,3,2,2,1],
  semi: [0,0,0,0,0,1, 2, 4, 6, 8, 8, 7, 5, 7, 8, 7, 6, 5, 3, 2,1,1,0,0],
};
const TASK_STATS = {
  amr:  {success:84,failed:4, running:8, queued:12},
  agv:  {success:62,failed:8, running:5, queued:6 },
  arm:  {success:45,failed:2, running:3, queued:4 },
  semi: {success:28,failed:1, running:2, queued:3 },
};
const ERROR_STATS = {
  amr:  {total:12,today:3,critical:1},
  agv:  {total:18,today:5,critical:2},
  arm:  {total:6, today:1,critical:0},
  semi: {total:4, today:1,critical:0},
};

function sumHourly(fleetIds){ return Array.from({length:24},(_,i)=>fleetIds.reduce((s,f)=>s+(HOURLY[f]?.[i]||0),0)); }
function sumTask(fleetIds){ return fleetIds.reduce((acc,f)=>{const d=TASK_STATS[f]||{};Object.keys(d).forEach(k=>acc[k]=(acc[k]||0)+d[k]);return acc;},{success:0,failed:0,running:0,queued:0}); }
function sumErr(fleetIds){ return fleetIds.reduce((acc,f)=>{const d=ERROR_STATS[f]||{};return{total:acc.total+d.total,today:acc.today+d.today,critical:acc.critical+d.critical};},{total:0,today:0,critical:0}); }

          return <g key={i}><line x1={pl} y1={y} x2={W-pr} y2={y} stroke="#e2e8f0" strokeDasharray={i===0?"":"3 3"}/><text x={pl-4} y={y+3} textAnchor="end" fill="#94a3b8" fontSize={8}>{Math.round(t*maxV)}</text></g>;

        {[0,3,6,9,12,15,18,21,23].map(h=>(

  function onMouseMove(e,di){

    <div className="relative" ref={wrapRef} onMouseLeave={()=>setTip(null)}>

              {isHov&&<rect x={pl+di*bw} y={pt} width={bw} height={H-pt-pb} fill="#f1f5f9" rx="4"/>}
              {d.values.map((v,vi)=>{
                const h=(v/maxV)*(H-pt-pb), y=cy-h;

          <div className="absolute z-30 pointer-events-none bg-slate-900 text-white rounded-lg shadow-xl px-3 py-2.5"

// 호버 가능한 도넛 차트
function MiniDonut({ segments }) {
  const cx=50,cy=50,r=38,ir=26;
  const [hovIdx,setHovIdx]=useState(null);
  const [tipPos,setTipPos]=useState({x:0,y:0});
  const wrapRef=useRef(null);

  const total=segments.reduce((s,x)=>s+(x.v||0),0)||1;

  function polar(angle){
    const rad=(angle-90)*Math.PI/180;
    return {x:cx+r*Math.cos(rad), y:cy+r*Math.sin(rad)};
  }
  function polarInner(angle){
    const rad=(angle-90)*Math.PI/180;
    return {x:cx+ir*Math.cos(rad), y:cy+ir*Math.sin(rad)};
  }
  function arcPath(startDeg,endDeg){
    const s=polar(startDeg), e=polar(endDeg);
    const si=polarInner(startDeg), ei=polarInner(endDeg);
    const large=endDeg-startDeg>180?1:0;
    return `M ${s.x} ${s.y} A ${r} ${r} 0 ${large} 1 ${e.x} ${e.y} L ${ei.x} ${ei.y} A ${ir} ${ir} 0 ${large} 0 ${si.x} ${si.y} Z`;
  }

  let cursor=0;
  const arcs=segments.filter(s=>s.v>0).map((s,i)=>{
    const sweep=(s.v/total)*360;
    const start=cursor, end=cursor+sweep;
    cursor=end;
    return {...s, start, end, idx:i};
  });

  const hov=hovIdx!==null?arcs.find(a=>a.idx===hovIdx):null;

  function onMove(e,idx){
    if(!wrapRef.current)return;
    const rect=wrapRef.current.getBoundingClientRect();
    setTipPos({x:e.clientX-rect.left,y:e.clientY-rect.top});
    setHovIdx(idx);
  }

  return(
    <div className="relative" ref={wrapRef} style={{width:88,height:88}} onMouseLeave={()=>setHovIdx(null)}>
      <svg viewBox="0 0 100 100" style={{width:88,height:88}}>
        <circle cx={cx} cy={cy} r={r} fill="none" stroke="#f1f5f9" strokeWidth={1}/>
        {arcs.map(a=>{
          const isHov=a.idx===hovIdx;
          const scale=isHov?1.06:1;
          return(
            <path key={a.idx}
              d={arcPath(a.start,a.end)}
              fill={a.color}
              opacity={hovIdx===null||isHov?1:0.55}
              style={{transform:`scale(${scale})`,transformOrigin:`${cx}px ${cy}px`,transition:"all 0.12s",cursor:"pointer"}}
              onMouseMove={e=>onMove(e,a.idx)}
            />
          );
        })}
        {/* 중앙 텍스트 */}
        <text x={cx} y={cx-4} textAnchor="middle" fill={hov?hov.color:"#0f172a"} fontSize={hov?10:14} fontWeight="700">
          {hov?hov.v:total}
        </text>
        <text x={cx} y={cx+8} textAnchor="middle" fill="#94a3b8" fontSize={7}>
          {hov?(hov.short||hov.label):"대"}
        </text>
      </svg>

      {/* 툴팁 */}
      {hov&&hov.robotIds&&hov.robotIds.length>0&&(()=>{
        const tipW=130;
        const right=tipPos.x+14+tipW>88;
        return(
          <div className="absolute z-40 pointer-events-none bg-slate-900 text-white rounded-lg shadow-xl px-2.5 py-2"
            style={{
              left: right?tipPos.x-tipW-6:tipPos.x+10,
              top: Math.max(0,tipPos.y-60),
              minWidth:tipW,
            }}>
            <div className="flex items-center gap-1.5 mb-1.5">
              <span className="w-2 h-2 rounded-sm shrink-0" style={{background:hov.color}}/>
              <span className="text-[11px] font-semibold">{hov.label}</span>
              <span className="ml-auto text-[10px] text-slate-400 tnum">{hov.v}대</span>
            </div>
            <div className="space-y-0.5">
              {hov.robotIds.map(id=>(
                <div key={id} className="flex items-center gap-1.5 text-[10.5px] text-slate-300">
                  <Icon name="Bot" size={9} className="text-slate-500 shrink-0"/>
                  <span className="tnum">{id}</span>
                </div>
              ))}
            </div>
          </div>
        );
      })()}
    </div>
  );
}

              const tasks=initOrders.filter(o=>o.robotId===r.id);
              const done=tasks.filter(o=>o.status==="done").length;
              // 현재 실행 중인 오더의 레시피명
              const runningOrder=tasks.find(o=>o.status==="running");
              const runningRecipe=runningOrder?recipes.find(rc=>rc.id===runningOrder.recipeId):null;
              return(
                <tr key={r.id} className="border-b border-slate-100 hover:bg-slate-50/60">

                    <div className="flex items-center gap-2">
                      <div className="w-7 h-7 rounded-md grid place-items-center text-white shrink-0" style={{background:fm.color}}>
                        <Icon name={r.fleet==="arm"?"Cog":"Bot"} size={13}/>
                      </div>
                      <span className="font-semibold text-slate-900 tnum">{r.id}</span>
                    </div>
                  </td>
                  <td className="py-3">
                    <span className="inline-flex items-center gap-1.5 px-1.5 py-0.5 rounded text-[11px] font-medium" style={{background:fm.color+"15",color:fm.color}}>
                      {fm.name}

                  </td>
                  <td className="py-3">
                    <span className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[11.5px] font-semibold" style={{background:sm.bg,color:sm.fg}}>
                      
                    </span>
                  </td>
                  <td className="py-3">
                    <div className="flex items-center gap-2">
                      <div className="w-16 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                        <div className="h-full rounded-full" style={{width:r.battery+"%",background:r.battery>50?"#10b981":r.battery>25?"#f59e0b":"#e11d48"}}/>

                      <span className="tnum text-[11.5px] text-slate-700 font-medium">{r.battery}%</span>
                    </div>
                  </td>
                  <td className="py-3">
                    {r.task
                      ? <div>
                          {runningRecipe&&(
                            <div className="text-[12px] font-semibold text-slate-900 leading-tight">{runningRecipe.name}</div>
                          )}
                          <div className="flex items-center gap-1 mt-0.5 text-[10.5px] text-slate-400">
                            <Icon name="Hash" size={9}/>
                            <span className="tnum">{r.task}</span>
                          </div>
                        </div>
                      : <span className="text-[11.5px] text-slate-400 italic">없음</span>
                    }
                  </td>
                  <td className="py-3 pr-4 text-right">
                    <span className="text-[12px] font-semibold text-slate-900 tnum">{done}</span>
                    <span className="text-[10.5px] text-slate-400 ml-1">/ {tasks.length}건</span>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

            {Array.from({length:totalPages},(_,i)=>i+1).filter(p=>p===1||p===totalPages||Math.abs(p-page)<=1)

function RecipeView({ onSaveRecipe }) {
  const [mode,setMode]=useState("list");
  const [editId,setEditId]=useState(null);
  const [metaMap,setMetaMap]=useState({
    "rcp-01":{creator:"samsung.kim", created:"2026-04-01", modifier:"park.lee",   modified:"2026-05-10"},
    "rcp-02":{creator:"choi.jun",    created:"2026-04-03", modifier:"samsung.kim",modified:"2026-05-09"},
    "rcp-03":{creator:"samsung.kim", created:"2026-04-05", modifier:"samsung.kim",modified:"2026-05-08"},
    "rcp-04":{creator:"park.lee",    created:"2026-04-10", modifier:"choi.jun",   modified:"2026-05-07"},
    "rcp-05":{creator:"choi.jun",    created:"2026-04-12", modifier:"park.lee",   modified:"2026-05-06"},
    "rcp-06":{creator:"park.lee",    created:"2026-04-15", modifier:"park.lee",   modified:"2026-05-05"},
  });

  function handleSave(recipe) {
    // 메타 업데이트
    const now = new Date();
    const dateStr = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
    setMetaMap(prev=>({
      ...prev,
      [recipe.id]: prev[recipe.id]
        ? {...prev[recipe.id], modifier:"samsung.kim", modified:dateStr}
        : {creator:"samsung.kim", created:dateStr, modifier:"samsung.kim", modified:dateStr}
    }));
    onSaveRecipe(recipe);
    setMode("list");
  }

  if (mode==="builder") return <RecipeBuilder recipeId={editId} onBack={()=>setMode("list")} onSave={handleSave}/>;

  const tempCount = 3;

  return <RecipeList
    recipes={recipes}
    meta={metaMap}
    tempCount={tempCount}
    onEdit={(id)=>{setEditId(id);setMode("builder");}}
    onNew={()=>{setEditId(null);setMode("builder");}}
  />;
}

          <span className="text-[11.5px] text-slate-500 tnum">

          </span>
          <div className="flex items-center gap-1">

              .reduce((acc,p,i,arr)=>{
                if(i>0&&arr[i-1]!==p-1) acc.push("...");
                acc.push(p); return acc;
              },[])
              .map((p,i)=>
                p==="..."
                  ? <span key={"e"+i} className="w-7 h-7 grid place-items-center text-[12px] text-slate-400">…</span>
                  : <button key={p} onClick={()=>setPage(p)}

                      {p}
                    </button>
              )
            }
            <button onClick={()=>setPage(p=>Math.min(totalPages,p+1))} disabled={page===totalPages} className="w-7 h-7 grid place-items-center rounded hover:bg-slate-100 disabled:opacity-30 text-slate-600">

              <Icon name="ChevronsRight" size={13}/>
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}
function RecipeBuilder({ recipeId, onBack, onSave }) {
  const initial = recipes.find(r=>r.id===recipeId);

  const [saved,setSaved]=useState(false); // Save 성공 토스트

  function handleSave() {
    const id = recipeId || ("rcp-"+Date.now());
    const recipe = { id, name, fleet, steps, nodes, status:"published" };
    if (onSave) onSave(recipe);
    setSaved(true);
    setTimeout(()=>setSaved(false), 2000);
  }
  const [nodes,setNodes]=useState(()=>{
    if(initial&&initial.nodes&&initial.nodes.length>0)return initial.nodes;
    if(initial)return initial.steps.map((s,i)=>({id:s.nodeId,x:120+(i%4)*160,y:140+Math.floor(i/4)*130,label:"Node "+(i+1)}));
    return[];
  });
  const [steps,setSteps]=useState(()=>initial?[...initial.steps]:[]);
  const [selIdx,setSelIdx]=useState(steps.length>0?0:null);
  const mapRef=useRef(null);
  const [mapMode,setMapMode]=useState("select");
  const [mapId,setMapId]=useState(floors[0].id);
  const [mapDropOpen,setMapDropOpen]=useState(false);
  const [dragFrom,setDragFrom]=useState(null);
  const [dragOver,setDragOver]=useState(null);
  const [tempSaves,setTempSaves]=useState([]);
  const [tempListOpen,setTempListOpen]=useState(false);

  const selStep=selIdx!==null?steps[selIdx]:null;
  const selNode=selStep?nodes.find(n=>n.id===selStep.nodeId):null;
  const totalDur=steps.reduce((s,st)=>s+(st.duration||0),0);

  function addStepForNode(node){
    if(!nodes.find(n=>n.id===node.id))setNodes(p=>[...p,node]);
    const validActs=actionTypes.filter(a=>a.fleets.includes(fleet));
    const def=validActs[0]||actionTypes[0];
    setSteps(p=>{setSelIdx(p.length);return[...p,{nodeId:node.id,actionType:def.id,duration:def.defaultDuration}];});
  }
  function removeStep(idx){
    const nodeId=steps[idx].nodeId;
    const newSteps=steps.filter((_,i)=>i!==idx);
    setSteps(newSteps);
    // 다른 스텝에서 같은 노드를 참조하지 않을 때만 nodes에서 제거
    if(!newSteps.find(s=>s.nodeId===nodeId)){
      setNodes(p=>p.filter(n=>n.id!==nodeId));
    }
    setSelIdx(null);
  }
  function updateStep(idx,patch){setSteps(p=>p.map((s,i)=>i===idx?{...s,...patch}:s));}
  function handleMapClick(e){
    if(mapMode!=="create")return;
    const rect=mapRef.current.getBoundingClientRect();
    const x=Math.round(e.clientX-rect.left),y=Math.round(e.clientY-rect.top);
    const id="N"+(nodes.length+1);
    addStepForNode({id,x,y,label:"Custom "+(nodes.length+1)});
  }
  function doTempSave(){
    const now=new Date();
    const ts=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0")+" "+String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
    setTempSaves(p=>[{id:Date.now(),name,fleet,steps:[...steps],nodes:[...nodes],savedAt:ts},...p.slice(0,19)]);
  }
  function switchMap(newMapId){

    setMapId(newMapId);
    setMapDropOpen(false);
  }
  function restoreTemp(t){
    setName(t.name);setFleet(t.fleet);setSteps([...t.steps]);setNodes([...t.nodes]);
    setSelIdx(null);setTempListOpen(false);
  }

  // Drag-to-reorder flow blocks
  function onBlockDragStart(e,i){setDragFrom(i);e.dataTransfer.effectAllowed="move";}
  function onBlockDragOver(e,i){e.preventDefault();if(dragFrom===null||dragFrom===i)return;setDragOver(i);}
  function onBlockDrop(e,i){
    e.preventDefault();
    if(dragFrom===null||dragFrom===i){setDragFrom(null);setDragOver(null);return;}
    const next=[...steps];const[moved]=next.splice(dragFrom,1);next.splice(i,0,moved);
    setSteps(next);setSelIdx(i);setDragFrom(null);setDragOver(null);

   SCHEDULER (GANTT)

const GANTT = { startHour:6, endHour:20, pxPerMin:2.4, rowH:56, BUFFER:5 };
const GW = (GANTT.endHour-GANTT.startHour)*60*GANTT.pxPerMin;
const RCOL = 168;
const SC = {
  done:   {bg:"bg-slate-100",border:"border-slate-300",fg:"text-slate-700",label:"완료",chip:"#94a3b8"},
  running:{bg:"bg-blue-100", border:"border-blue-400", fg:"text-blue-900", label:"진행중",chip:"#2563eb"},
  queued: {bg:"bg-amber-50", border:"border-amber-300",fg:"text-amber-900",label:"예약",chip:"#d97706"},
  error:  {bg:"bg-rose-100", border:"border-rose-400", fg:"text-rose-900", label:"실패",chip:"#e11d48"},
};

function computePlacement(allOrders, robotId, desiredStart, duration, ignoreId) {
  const row = allOrders.filter(o=>o.robotId===robotId&&o.id!==ignoreId);
  let start=desiredStart, safety=0, conflict=false;
  while(safety++<100){
    const end=start+duration;
    const blocker=row.find(o=>{const dur=recipeDuration(recipes.find(r=>r.id===o.recipeId));const os=o.start-GANTT.BUFFER,oe=o.start+dur+GANTT.BUFFER;return start<oe&&end>os;});
    if(!blocker)break;
    conflict=true;
    const dur=recipeDuration(recipes.find(r=>r.id===blocker.recipeId));
    start=blocker.start+dur+GANTT.BUFFER;
  }
  return {start,conflict};
}

function SchedulerView({ initialFocusRecipeId }) {
  const [orders,setOrders]=useState(initOrders.map(o=>({...o})));
  const [selOrder,setSelOrder]=useState(null);
  const [draggingRcp,setDraggingRcp]=useState(null);
  const [hoverPrev,setHoverPrev]=useState(null);
  const [libOpen,setLibOpen]=useState(true);
  const [now,setNow]=useState(11*60+12);
  const [hlRcp,setHlRcp]=useState(initialFocusRecipeId||null);
  const [addOpen,setAddOpen]=useState(false);
  const [fleetF,setFleetF]=useState(new Set());
  const [libQ,setLibQ]=useState("");
  const [libFleetF,setLibFleetF]=useState(new Set());
  const [moving,setMoving]=useState(null);
  const [schedDate,setSchedDate]=useState("2026-05-13");
  const [schedMapId,setSchedMapId]=useState("p3-3f");
  const [schedMapOpen,setSchedMapOpen]=useState(false);
  const pressRef=useRef(null);
  const lastDragRef=useRef(0);
  const ganttRef=useRef(null);
  const headRef=useRef(null);
  const rColRef=useRef(null);

  const allR=robots;
  const visR=fleetF.size===0?allR:allR.filter(r=>fleetF.has(r.fleet));

  useEffect(()=>{const id=setInterval(()=>setNow(n=>n+1),8000);return()=>clearInterval(id);},[]);
  useEffect(()=>{
    const g=ganttRef.current,h=headRef.current;if(!g||!h)return;
    const fn=()=>{h.scrollLeft=g.scrollLeft;if(rColRef.current)rColRef.current.scrollTop=g.scrollTop;};
    g.addEventListener("scroll",fn);return()=>g.removeEventListener("scroll",fn);
  },[]);

  function timeFromX(clientX){
    const rect=ganttRef.current.getBoundingClientRect();
    const x=clientX-rect.left+ganttRef.current.scrollLeft;
    const min=GANTT.startHour*60+x/GANTT.pxPerMin;
    return Math.max(GANTT.startHour*60,Math.min(GANTT.endHour*60,Math.round(min/5)*5));
  }
  function onLibDragStart(e,rId){setDraggingRcp(rId);e.dataTransfer.setData("text/plain",rId);e.dataTransfer.effectAllowed="copy";}
  function onRowDragOver(e,rId){
    e.preventDefault();if(!draggingRcp)return;
    const r=recipes.find(r=>r.id===draggingRcp);if(!r)return;
    const robot=visR.find(rb=>rb.id===rId);
    // fleet 불일치 — 드롭 불가 표시
    if(robot && robot.fleet!==r.fleet){
      e.dataTransfer.dropEffect="none";
      setHoverPrev({robotId:rId,start:timeFromX(e.clientX),duration:recipeDuration(r),recipeId:r.id,conflict:false,fleetMismatch:true});
      return;
    }
    const dur=recipeDuration(r),start=timeFromX(e.clientX);
    const p=computePlacement(orders,rId,start,dur,null);
    setHoverPrev({robotId:rId,start:p.start,duration:dur,recipeId:r.id,conflict:p.conflict,fleetMismatch:false});
  }
  function onRowDrop(e,rId){
    e.preventDefault();if(!draggingRcp)return;
    const r=recipes.find(r=>r.id===draggingRcp);if(!r)return;
    const robot=visR.find(rb=>rb.id===rId);
    // fleet 불일치 — 드롭 차단
    if(robot && robot.fleet!==r.fleet){
      setDraggingRcp(null);setHoverPrev(null);return;
    }
    const dur=recipeDuration(r),start=timeFromX(e.clientX);
    const p=computePlacement(orders,rId,start,dur,null);
    setOrders(o=>[...o,{id:"ord-"+(1000+o.length),robotId:rId,recipeId:r.id,start:p.start,status:"queued"}]);
    setDraggingRcp(null);setHoverPrev(null);
  }
  function isEditable(o){return o.status==="queued"&&o.start>now;}
  function copyOrder(o){
    const r=recipes.find(rr=>rr.id===o.recipeId);if(!r)return;
    const dur=recipeDuration(r),p=computePlacement(orders,o.robotId,o.start+dur+GANTT.BUFFER,dur,null);
    setOrders(oo=>[...oo,{id:"ord-"+(1000+oo.length+Math.floor(Math.random()*99)),robotId:o.robotId,recipeId:o.recipeId,start:p.start,status:"queued"}]);
    setSelOrder(null);
  }
  function deleteOrder(o){setOrders(oo=>oo.filter(x=>x.id!==o.id));setSelOrder(null);}
  function onBlockMouseDown(e,o){
    if(e.button!==0||!isEditable(o))return;
    const r=recipes.find(rr=>rr.id===o.recipeId);if(!r)return;
    const dur=recipeDuration(r);
    pressRef.current={orderId:o.id,robotId:o.robotId,startX:e.clientX,origStart:o.start,duration:dur,moved:false};
    const onMove=ev=>{const p=pressRef.current;if(!p)return;const dx=ev.clientX-p.startX;if(!p.moved&&Math.abs(dx)<4)return;p.moved=true;const dt=Math.round(dx/GANTT.pxPerMin/5)*5,desired=Math.max(now,p.origStart+dt);const pl=computePlacement(orders,p.robotId,desired,p.duration,p.orderId);setMoving({orderId:p.orderId,robotId:p.robotId,ghostStart:pl.start,conflict:pl.conflict});};
    const onUp=ev=>{const p=pressRef.current;window.removeEventListener("mousemove",onMove);window.removeEventListener("mouseup",onUp);if(p&&p.moved){const dx=ev.clientX-p.startX,dt=Math.round(dx/GANTT.pxPerMin/5)*5,desired=Math.max(now,p.origStart+dt);const pl=computePlacement(orders,p.robotId,desired,p.duration,p.orderId);setOrders(oo=>oo.map(x=>x.id===p.orderId?{...x,start:pl.start}:x));lastDragRef.current=Date.now();}pressRef.current=null;setMoving(null);};
    window.addEventListener("mousemove",onMove);window.addEventListener("mouseup",onUp);e.preventDefault();
  }

  return (
    <div className="h-full flex flex-col bg-slate-50">
      {/* Sub-header */}
      <div className="h-12 px-5 border-b border-slate-200 bg-white flex items-center gap-2">

              onChange={e=>setSchedDate(e.target.value)}
              className="h-8 pl-2 pr-2 rounded-md border border-slate-200 bg-white text-[13px] font-semibold text-slate-900 outline-none focus:border-blue-400 cursor-pointer"
            />
          </div>
        </div>

        <div className="h-5 w-px bg-slate-200"/>

        {/* 맵 선택 드랍다운 */}
        <div className="relative">
          <button onClick={()=>setSchedMapOpen(o=>!o)}
            className={"h-8 pl-3 pr-2 flex items-center gap-1.5 rounded-md border bg-white text-[12.5px] font-medium transition "+(schedMapOpen?"border-blue-400 ring-2 ring-blue-100 text-blue-700":"border-slate-200 hover:border-slate-300 text-slate-700")}>

            <span>{floors.find(f=>f.id===schedMapId)?.label}</span>
            <Icon name="ChevronDown" size={11} className={"text-slate-400 ml-1 transition-transform "+(schedMapOpen?"rotate-180":"")}/>
          </button>
          {schedMapOpen&&<>
            <div className="fixed inset-0 z-10" onClick={()=>setSchedMapOpen(false)}/>

function AddOrderDialog({ orders, onClose, onCreate }) {
  const today=new Date();
  const todayStr=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
  const [fleet,setFleet]=useState("amr");
  const fr=recipes.filter(r=>r.fleet===fleet);
  const rb=robots.filter(r=>r.fleet===fleet);
  const [recipeId,setRecipeId]=useState(fr[0]?.id||"");
  const [robotId,setRobotId]=useState(rb[0]?.id||"");
  const [date,setDate]=useState(todayStr);
  const [hour,setHour]=useState(13);
  const [minute,setMinute]=useState(0);
  const [repeat,setRepeat]=useState(false);
  const [repeatDays,setRepeatDays]=useState(new Set());
  useEffect(()=>{const rs=recipes.filter(r=>r.fleet===fleet),rbs=robots.filter(r=>r.fleet===fleet);if(!rs.find(r=>r.id===recipeId))setRecipeId(rs[0]?.id||"");if(!rbs.find(r=>r.id===robotId))setRobotId(rbs[0]?.id||"");},[fleet]);
  const recipe=recipes.find(r=>r.id===recipeId);
  const dur=recipe?recipeDuration(recipe):0;
  const desired=hour*60+minute;
  const placement=recipe&&robotId?computePlacement(orders,robotId,desired,dur,null):{start:desired,conflict:false};
  const shifted=placement.conflict&&placement.start!==desired;
  const DAYS=[{id:0,label:"일"},{id:1,label:"월"},{id:2,label:"화"},{id:3,label:"수"},{id:4,label:"목"},{id:5,label:"금"},{id:6,label:"토"}];

        </div>
      </div>
    </div>
  );

              <span className="text-[10.5px] font-semibold text-slate-400 uppercase tracking-wider w-14 shrink-0 mt-1.5">중분류</span>
              <div className="flex flex-wrap gap-2">
                {sub2Options.map(k=>{
                  const on=cat2.has(k);
                  return(
                    <button key={k} onClick={()=>toggle(setCat2,k)}
                      className={"h-8 px-3.5 rounded-lg text-[12px] font-medium border-2 transition flex items-center gap-1.5 "+(on?"border-blue-500 bg-blue-50 text-blue-700":"border-slate-200 bg-white text-slate-600 hover:border-slate-300")}>
                      {on&&<Icon name="Check" size={11} className="text-blue-500"/>}

            {/* 소분류 — 단일 선택 */}

              <span className="text-[10.5px] font-semibold text-slate-400 uppercase tracking-wider w-14 shrink-0 mt-1.5">소분류</span>
              <div className="flex flex-wrap gap-2">
                {sub3Options.map(k=>{
                  const on=cat3===k;

                    <button key={k} onClick={()=>setCat3(k)}
                      className={"h-8 px-3.5 rounded-lg text-[12px] font-semibold border-2 transition flex items-center gap-1.5 "+(

              <Icon name="Search" size={12} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400"/>

                  <th className={thCls}>Robot ID</th>
                  <th className={thCls}>작업유형</th>
                  <th className={thCls}>상태코드</th>
                  <th className={thCls}>우선순위</th>
                  <th className={thCls}>시작</th>
                  <th className={thCls}>종료</th>
                  <th className={thCls}>취소</th>
                  <th className={thCls}>출발지</th>
                  <th className={thCls}>목적지</th>
                  <th className={thCls}>이동거리</th>
                  <th className={thCls}>배터리 소모</th>
                  <th className={thCls+" pr-4"}>Error Code</th>
                </tr></thead>
                <tbody>
                  {orderFiltered.length===0&&<tr><td colSpan={13} className="px-4 py-12 text-center text-slate-400 text-[12.5px]"><Icon name="SearchX" size={20} className="mx-auto mb-2 text-slate-300"/>데이터가 없습니다.</td></tr>}
                  {orderFiltered.map((d,i)=>{
                    const f=fleets.find(fl=>fl.name===d.fleet);
                    const isFail=d.statusCode.startsWith("FAIL");
                    return(
                      <tr key={i} className={"border-b border-slate-100 hover:bg-slate-50/60 "+(isFail?"bg-rose-50/20":"")}>
                        <td className={tdCls+" px-4"}>

                        </td>
                        <td className={tdCls}><span className="font-mono bg-slate-100 px-1.5 py-0.5 rounded text-[11px]">{d.robotId}</span></td>
                        <td className={tdCls}>{d.taskType}</td>
                        <td className={tdCls}>{statusBadge(d.statusCode)}</td>

                        <td className={tdCls+" tnum"}>{d.startAt}</td>
                        <td className={tdCls+" tnum"}>{d.endAt}</td>
                        <td className={tdCls+" tnum text-rose-500"}>{d.cancelAt!=="-"?d.cancelAt:"-"}</td>
                        <td className={tdCls}><span className="font-mono text-[11px]">{d.departure}</span></td>
                        <td className={tdCls}><span className="font-mono text-[11px]">{d.destination}</span></td>
                        <td className={tdCls+" tnum"}>{d.distance}</td>
                        <td className={tdCls+" tnum"}>{d.batteryUsed}</td>
                        <td className={tdCls+" pr-4"}>{d.errorCode!=="-"?<span className="font-mono text-[11px] text-rose-600 bg-rose-50 px-1.5 py-0.5 rounded">{d.errorCode}</span>:<span className="text-slate-300">—</span>}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}

          {/* ── Robot · Error 컬럼 ── */}
          {isRobotError&&(
            <div className="overflow-x-auto">
              <table className="w-full text-[12px] min-w-[1200px]">
                <thead><tr className="text-left border-b border-slate-200 bg-slate-50/40">
                  <th className={thCls+" px-4"}>Fleet</th>
                  <th className={thCls}>Robot ID</th>
                  <th className={thCls}>에러 코드</th>
                  <th className={thCls}>심각도</th>
                  <th className={thCls}>발생 시점</th>
                  <th className={thCls}>해제 시점</th>
                  <th className={thCls}>발생 위치</th>
                  <th className={thCls+" min-w-[200px]"}>에러 메시지</th>
                  <th className={thCls}>조치 상태</th>
                  <th className={thCls}>담당자</th>
                  <th className={thCls+" pr-4"}>연관 Order ID</th>
                </tr></thead>
                <tbody>
                  {errorFiltered.length===0&&<tr><td colSpan={11} className="px-4 py-12 text-center text-slate-400 text-[12.5px]"><Icon name="SearchX" size={20} className="mx-auto mb-2 text-slate-300"/>데이터가 없습니다.</td></tr>}
                  {errorFiltered.map((d,i)=>{
                    const f=fleets.find(fl=>fl.name===d.fleet);
                    return(
                      <tr key={i} className={"border-b border-slate-100 hover:bg-slate-50/60 "+(d.severity==="Error"?"bg-rose-50/20":d.severity==="Warn"?"bg-amber-50/10":"")}>
                        <td className={tdCls+" px-4"}>
                          <span className="inline-flex items-center gap-1.5 px-1.5 py-0.5 rounded text-[10.5px] font-medium" style={{background:(f?.color||"#64748b")+"20",color:f?.color||"#64748b"}}>
                            {d.fleet}
                          </span>
                        </td>
                        <td className={tdCls}><span className="font-mono bg-slate-100 px-1.5 py-0.5 rounded text-[11px]">{d.robotId}</span></td>
                        <td className={tdCls}><span className="font-mono text-[11px] text-rose-600 bg-rose-50 px-1.5 py-0.5 rounded">{d.errorCode}</span></td>
                        <td className={tdCls}>{sevBadge(d.severity)}</td>
                        <td className={tdCls+" tnum"}>{d.occurredAt}</td>
                        <td className={tdCls+" tnum"}>{d.resolvedAt||"-"}</td>
                        <td className={tdCls}><span className="font-mono text-[11px]">{d.location}</span></td>
                        <td className={tdCls+" min-w-[200px] max-w-[280px] whitespace-normal leading-snug"}>{d.message}</td>
                        <td className={tdCls}>{actionBadge(d.actionStatus)}</td>
                        <td className={tdCls}>{d.assignee!=="-"?<span className="font-mono text-[11px]">{d.assignee}</span>:<span className="text-slate-300">—</span>}</td>
                        <td className={tdCls+" pr-4"}>{d.relatedOrderId!=="-"?<span className="font-mono text-[11px] text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded">{d.relatedOrderId}</span>:<span className="text-slate-300">—</span>}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}

          {/* ── Infra 공백 ── */}
          {(isInfraOnly||(hasInfra&&!isRobotOrder&&!isRobotError&&cat3!=="Order"&&cat3!=="Error"))&&(
            <div className="py-20 text-center">
              <div className="w-16 h-16 mx-auto rounded-2xl bg-slate-50 border border-slate-200 grid place-items-center mb-4">
                <Icon name="Server" size={26} className="text-slate-300"/>
              </div>
              <div className="text-[14px] font-semibold text-slate-500">인프라 로그</div>
              <div className="text-[12px] text-slate-400 mt-1.5">준비 중입니다.</div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

  {id:"new.user2", name:"신규2", dept:"스마트팩토리팀",       fleets:["agv","arm"], role:"Admin",    requestedAt:"2026-05-13 14:22"},
  {id:"new.user3", name:"신규3", dept:"Digital Twin Center", fleets:["amr","agv","arm","semi"], role:"Engineer", requestedAt:"2026-05-14 10:05"},
];

function PermissionsView() {
  const [tab,setTab]=useState("list");
  const [users,setUsers]=useState(initUsers);
  const [pending,setPending]=useState(initPending);
  const [fleetF,setFleetF]=useState(new Set());
  const [roleF,setRoleF]=useState(new Set());
  const [deptF,setDeptF]=useState(new Set());
  const [q,setQ]=useState("");
  const [page,setPage]=useState(1);
  const PAGE_SIZE=10;
  const [editUser,setEditUser]=useState(null);
  const [toast,setToast]=useState(null);
  const canEdit = ROLES.indexOf(CURRENT_USER.role) >= ROLES.indexOf("Admin");

  function showToast(msg,type="success"){setToast({msg,type});setTimeout(()=>setToast(null),2500);}

  const filtered = users.filter(u=>{
    if(fleetF.size>0 && !u.fleets.some(f=>fleetF.has(f))) return false;
    if(roleF.size>0 && !roleF.has(u.role)) return false;
    if(deptF.size>0 && !deptF.has(u.dept)) return false;
    if(q && !u.id.toLowerCase().includes(q.toLowerCase()) &&
           !u.name.includes(q) &&
           !u.dept.toLowerCase().includes(q.toLowerCase())) return false;
    return true;
  });

  const totalPages = Math.max(1, Math.ceil(filtered.length/PAGE_SIZE));
  const paged = filtered.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);

  function resetPage(){ setPage(1); }

  function handleDelete(id){
    if(id===CURRENT_USER.id) return showToast("자신의 계정은 삭제할 수 없습니다.","error");
    setUsers(p=>p.filter(u=>u.id!==id));
    showToast("사용자 권한이 삭제되었습니다.");
  }
  function handleApprove(p){
    setUsers(prev=>[...prev,{id:p.id,name:p.name,dept:p.dept,fleets:p.fleets,role:p.role,joined:new Date().toISOString().slice(0,10)}]);
    setPending(prev=>prev.filter(x=>x.id!==p.id));
    showToast(`${p.id} 승인 완료`);
  }
  function handleReject(id){setPending(prev=>prev.filter(x=>x.id!==id));showToast("승인 요청이 거절되었습니다.","warn");}
  function handleEditSave(userId,newRole,newFleets,newDept){
    setUsers(p=>p.map(u=>u.id===userId?{...u,role:newRole,fleets:newFleets,dept:newDept}:u));
    setEditUser(null);
    showToast("권한이 수정되었습니다.");
  }

  const fleetBadge = (fId) => {
    const f = fleets.find(fl=>fl.id===fId);
    return f ? <span key={fId} className="inline-flex items-center gap-1 px-1.5 py-px rounded text-[10px] font-semibold" style={{background:f.color+"20",color:f.color}}>{f.name}</span> : null;
  };

  return (
    <div className="h-full overflow-auto p-6 bg-slate-50">
      {/* Header */}
      <div className="flex items-end justify-between mb-5">
        <div>
          <h1 className="text-[20px] font-semibold text-slate-900 tracking-tight">권한 관리</h1>
          <p className="text-[12.5px] text-slate-500 mt-0.5">Fleet 별 사용자 접근 권한을 관리합니다. Admin 이상 권한 소유자만 수정 가능합니다.</p>
        </div>
        <div className="flex items-center gap-2 px-3 py-2 rounded-lg bg-white border border-slate-200 shadow-sm">
          <div className="w-7 h-7 rounded-full bg-gradient-to-br from-purple-500 to-blue-600 grid place-items-center text-white text-[11px] font-semibold">김</div>
          <div className="leading-tight">
            <div className="text-[12px] font-semibold text-slate-900">{CURRENT_USER.id}</div>
            <div className="text-[10px] text-purple-600 font-semibold">{CURRENT_USER.role}</div>
          </div>
          <span className={"ml-1 text-[10.5px] font-semibold px-2 py-0.5 rounded-full "+ROLE_COLOR[CURRENT_USER.role]}>{CURRENT_USER.role}</span>
        </div>
      </div>

      {/* Card */}
      <div className="bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden">
        {/* Tabs + toolbar */}
        <div className="border-b border-slate-200">
          <div className="px-4 flex items-center gap-1 h-12">
            <button onClick={()=>setTab("list")} className={"h-8 px-4 rounded-md text-[13px] font-medium flex items-center gap-2 "+(tab==="list"?"bg-blue-50 text-blue-700":"text-slate-600 hover:bg-slate-50")}>
              <Icon name="Users" size={14}/> 권한 목록
              <span className={"text-[11px] px-1.5 py-0.5 rounded-full tnum "+(tab==="list"?"bg-blue-100 text-blue-700":"bg-slate-100 text-slate-500")}>{users.length}</span>
            </button>
            <button onClick={()=>setTab("pending")} className={"h-8 px-4 rounded-md text-[13px] font-medium flex items-center gap-2 "+(tab==="pending"?"bg-amber-50 text-amber-700":"text-slate-600 hover:bg-slate-50")}>
              <Icon name="Clock" size={14}/> 승인 대기
              {pending.length>0&&<span className={"text-[11px] px-1.5 py-0.5 rounded-full tnum font-semibold "+(tab==="pending"?"bg-amber-200 text-amber-800":"bg-rose-100 text-rose-600")}>{pending.length}</span>}
            </button>
          </div>
          {/* 필터 툴바 */}
          {tab==="list"&&(
            <div className="px-4 pb-3 flex items-center gap-2 flex-wrap">
              {/* 검색 */}
              <div className="relative">
                <Icon name="Search" size={12} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400"/>
                <input value={q} onChange={e=>{setQ(e.target.value);resetPage();}}
                  placeholder="ID · 이름 · 부서 검색"
                  className="h-8 pl-7 pr-7 w-[200px] rounded-md border border-slate-200 bg-slate-50 text-[12px] outline-none focus:border-blue-400 focus:bg-white"/>
                {q&&<button onClick={()=>{setQ("");resetPage();}} className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"><Icon name="X" size={11}/></button>}
              </div>
              {/* 부서 */}
              <MultiSelectDropdown
                label="부서"
                value={deptF}
                onChange={v=>{setDeptF(v);resetPage();}}
                options={DEPTS.map(d=>({id:d,label:d}))}
              />
              {/* Fleet */}
              <MultiSelectDropdown
                label="Fleet"
                value={fleetF}
                onChange={v=>{setFleetF(v);resetPage();}}
                options={fleets.map(f=>({id:f.id,label:f.name,color:f.color}))}
                colorMap={Object.fromEntries(fleets.map(f=>[f.id,f.color]))}
              />
              {/* 권한 */}
              <MultiSelectDropdown
                label="권한"
                value={roleF}
                onChange={v=>{setRoleF(v);resetPage();}}
                options={ROLES.map(r=>({id:r,label:r}))}
              />
              <span className="ml-auto text-[11.5px] text-slate-400 tnum">{filtered.length}명</span>
            </div>
          )}
        </div>

        {/* 권한 목록 */}
        {tab==="list"&&(<>
          <table className="w-full text-[12.5px]">
            <thead><tr className="text-left text-[11px] text-slate-500 border-b border-slate-200 bg-slate-50/40">
              <th className="font-medium px-4 py-2.5">사용자 ID</th>
              <th className="font-medium py-2.5">이름</th>
              <th className="font-medium py-2.5">부서</th>
              <th className="font-medium py-2.5 min-w-[180px]">Fleet 권한</th>
              <th className="font-medium py-2.5">권한 등급</th>
              <th className="font-medium py-2.5">등록일</th>
              {canEdit&&<th className="font-medium py-2.5 text-right pr-4">액션</th>}
            </tr></thead>
            <tbody>
              {paged.length===0&&<tr><td colSpan={7} className="px-4 py-12 text-center text-[12.5px] text-slate-400"><Icon name="SearchX" size={20} className="mx-auto mb-2 text-slate-300"/>검색 결과가 없습니다.</td></tr>}
              {paged.map(u=>(
                <tr key={u.id} className="border-b border-slate-100 hover:bg-slate-50/60 group">
                  <td className="px-4 py-3">
                    <div className="flex items-center gap-2">
                      <div className="w-7 h-7 rounded-full bg-gradient-to-br from-slate-400 to-slate-600 grid place-items-center text-white text-[11px] font-semibold shrink-0">{u.name[0]}</div>
                      <span className="font-mono text-[12px] text-slate-800">{u.id}</span>
                      {u.id===CURRENT_USER.id&&<span className="text-[9.5px] font-semibold px-1.5 py-px rounded bg-blue-100 text-blue-700">나</span>}
                    </div>
                  </td>
                  <td className="py-3 text-slate-800 font-medium">{u.name}</td>
                  <td className="py-3 text-[11.5px] text-slate-600">{u.dept}</td>
                  <td className="py-3">
                    <div className="flex flex-wrap gap-1">
                      {u.fleets.length===fleets.length
                        ? <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-slate-100 text-slate-600 text-[11px] font-medium"><Icon name="Globe" size={10}/> 전체</span>
                        : u.fleets.map(fId=>fleetBadge(fId))
                      }
                    </div>
                  </td>
                  <td className="py-3">
                    <span className={"inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11.5px] font-semibold "+ROLE_COLOR[u.role]}>
                      {u.role==="Master"&&<Icon name="Crown" size={10}/>}
                      {u.role==="Admin"&&<Icon name="ShieldCheck" size={10}/>}
                      {u.role==="Engineer"&&<Icon name="Wrench" size={10}/>}
                      {u.role}
                    </span>
                  </td>
                  <td className="py-3 tnum text-[11.5px] text-slate-500">{u.joined}</td>
                  {canEdit&&(
                    <td className="py-3 pr-4 text-right">
                      <div className="flex items-center justify-end gap-1 opacity-0 group-hover:opacity-100 transition">
                        {u.id!==CURRENT_USER.id&&<>
                          <button onClick={()=>setEditUser({...u,fleets:[...u.fleets]})} className="h-7 px-2.5 rounded border border-slate-200 bg-white hover:bg-blue-50 hover:border-blue-300 text-[11px] font-medium text-slate-600 hover:text-blue-700 flex items-center gap-1">
                            <Icon name="Pencil" size={11}/> 수정
                          </button>
                          <button onClick={()=>handleDelete(u.id)} className="h-7 px-2 rounded border border-rose-200 bg-white hover:bg-rose-50 text-[11px] font-medium text-rose-500 hover:text-rose-700 flex items-center gap-1">
                            <Icon name="Trash2" size={11}/> 삭제
                          </button>
                        </>}
                      </div>
                    </td>
                  )}
                </tr>
              ))}
            </tbody>
          </table>

          {/* 페이징 */}
          <div className="h-12 px-4 border-t border-slate-200 flex items-center justify-between bg-slate-50/40">
            <span className="text-[11.5px] text-slate-500 tnum">
              {filtered.length===0?"0명":`${(page-1)*PAGE_SIZE+1}–${Math.min(page*PAGE_SIZE,filtered.length)} / ${filtered.length}명`}
            </span>
            <div className="flex items-center gap-1">
              <button onClick={()=>setPage(1)} disabled={page===1} className="w-7 h-7 grid place-items-center rounded hover:bg-slate-100 disabled:opacity-30 text-slate-600"><Icon name="ChevronsLeft" size={13}/></button>
              <button onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={page===1} className="w-7 h-7 grid place-items-center rounded hover:bg-slate-100 disabled:opacity-30 text-slate-600"><Icon name="ChevronLeft" size={13}/></button>
              {Array.from({length:totalPages},(_,i)=>i+1)
                .filter(p=>p===1||p===totalPages||Math.abs(p-page)<=1)
                .reduce((acc,p,i,arr)=>{if(i>0&&arr[i-1]!==p-1)acc.push("...");acc.push(p);return acc;},[])
                .map((p,i)=>p==="..."
                  ?<span key={"e"+i} className="w-7 h-7 grid place-items-center text-[12px] text-slate-400">…</span>
                  :<button key={p} onClick={()=>setPage(p)} className={"w-7 h-7 grid place-items-center rounded text-[12px] font-medium "+(p===page?"bg-blue-600 text-white":"hover:bg-slate-100 text-slate-600")}>{p}</button>
                )
              }
              <button onClick={()=>setPage(p=>Math.min(totalPages,p+1))} disabled={page===totalPages} className="w-7 h-7 grid place-items-center rounded hover:bg-slate-100 disabled:opacity-30 text-slate-600"><Icon name="ChevronRight" size={13}/></button>
              <button onClick={()=>setPage(totalPages)} disabled={page===totalPages} className="w-7 h-7 grid place-items-center rounded hover:bg-slate-100 disabled:opacity-30 text-slate-600"><Icon name="ChevronsRight" size={13}/></button>
            </div>
          </div>
        </>)}

        {/* 승인 대기 */}
        {tab==="pending"&&(
          pending.length===0
            ?<div className="py-16 text-center"><Icon name="CheckCircle2" size={28} className="mx-auto mb-3 text-emerald-400"/><div className="text-[13px] font-medium text-slate-600">승인 대기 요청이 없습니다.</div></div>
            :<table className="w-full text-[12.5px]">
              <thead><tr className="text-left text-[11px] text-slate-500 border-b border-slate-200 bg-slate-50/40">
                <th className="font-medium px-4 py-2.5">사용자 ID</th>
                <th className="font-medium py-2.5">이름</th>
                <th className="font-medium py-2.5">부서</th>
                <th className="font-medium py-2.5">요청 Fleet</th>
                <th className="font-medium py-2.5">요청 권한</th>
                <th className="font-medium py-2.5">요청 일시</th>
                <th className="font-medium py-2.5 text-right pr-4">액션</th>
              </tr></thead>
              <tbody>
                {pending.map(p=>(
                  <tr key={p.id} className="border-b border-slate-100 hover:bg-slate-50/60">
                    <td className="px-4 py-3 font-mono text-[12px] text-slate-800">{p.id}</td>
                    <td className="py-3 text-slate-800 font-medium">{p.name}</td>
                    <td className="py-3 text-[11.5px] text-slate-600">{p.dept}</td>
                    <td className="py-3">
                      <div className="flex flex-wrap gap-1">
                        {p.fleets.length===fleets.length
                          ?<span className="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-slate-100 text-slate-600 text-[11px]"><Icon name="Globe" size={10}/> 전체</span>
                          :p.fleets.map(fId=>fleetBadge(fId))
                        }
                      </div>
                    </td>
                    <td className="py-3"><span className={"inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11.5px] font-semibold "+ROLE_COLOR[p.role]}>{p.role}</span></td>
                    <td className="py-3 tnum text-[11.5px] text-slate-500">{p.requestedAt}</td>
                    <td className="py-3 pr-4 text-right">
                      <div className="flex items-center justify-end gap-1.5">
                        {canEdit?<>
                          <button onClick={()=>handleApprove(p)} className="h-7 px-3 rounded-md bg-emerald-600 hover:bg-emerald-700 text-white text-[11.5px] font-medium flex items-center gap-1"><Icon name="Check" size={11}/> 승인</button>
                          <button onClick={()=>handleReject(p.id)} className="h-7 px-3 rounded-md border border-rose-200 bg-white hover:bg-rose-50 text-rose-600 text-[11.5px] font-medium flex items-center gap-1"><Icon name="X" size={11}/> 거절</button>
                        </>:<span className="text-[11px] text-slate-400 flex items-center gap-1"><Icon name="Lock" size={10}/> Admin 이상 권한 필요</span>}
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
        )}
      </div>

      {/* 수정 모달 */}
      {editUser&&(
        <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm grid place-items-center p-4" onClick={()=>setEditUser(null)}>
          <div className="w-[460px] bg-white rounded-xl shadow-2xl border border-slate-200 overflow-hidden" onClick={e=>e.stopPropagation()}>
            <div className="h-12 px-5 border-b border-slate-200 flex items-center gap-2">
              <div className="w-7 h-7 rounded-md bg-blue-50 grid place-items-center text-blue-600"><Icon name="Pencil" size={14}/></div>
              <h3 className="text-[14px] font-semibold text-slate-900">권한 수정</h3>
              <button onClick={()=>setEditUser(null)} className="ml-auto w-7 h-7 grid place-items-center rounded hover:bg-slate-100 text-slate-500"><Icon name="X" size={14}/></button>
            </div>
            <div className="p-5 space-y-4">
              {/* 사용자 정보 */}
              <div className="flex items-center gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200">
                <div className="w-9 h-9 rounded-full bg-gradient-to-br from-slate-400 to-slate-600 grid place-items-center text-white font-semibold">{editUser.name[0]}</div>
                <div><div className="font-mono text-[13px] font-semibold text-slate-900">{editUser.id}</div><div className="text-[11px] text-slate-500">{editUser.name} · {editUser.dept}</div></div>
              </div>
              {/* 부서 */}
              <div>
                <div className="text-[11px] font-medium text-slate-500 mb-1.5">부서</div>
                <div className="relative">
                  <select value={editUser.dept} onChange={e=>setEditUser({...editUser,dept:e.target.value})} className="h-9 pl-3 pr-8 w-full rounded-md border border-slate-200 bg-white text-[12.5px] outline-none focus:border-blue-400 appearance-none">
                    {DEPTS.map(d=><option key={d} value={d}>{d}</option>)}
                  </select>
                  <Icon name="ChevronDown" size={12} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/>
                </div>
              </div>
              {/* Fleet 권한 — 다중 선택 */}
              <div>
                <div className="text-[11px] font-medium text-slate-500 mb-1.5 flex items-center justify-between">
                  <span>Fleet 접근 권한</span>
                  <button onClick={()=>setEditUser({...editUser,fleets:editUser.fleets.length===fleets.length?[]:fleets.map(f=>f.id)})}
                    className="text-[10.5px] text-blue-600 hover:text-blue-800">
                    {editUser.fleets.length===fleets.length?"전체 해제":"전체 선택"}
                  </button>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  {fleets.map(f=>{
                    const on=editUser.fleets.includes(f.id);
                    return (
                      <button key={f.id} onClick={()=>{
                        const next=on?editUser.fleets.filter(x=>x!==f.id):[...editUser.fleets,f.id];
                        setEditUser({...editUser,fleets:next});
                      }}
                      className={"h-9 rounded-lg border-2 flex items-center gap-2 px-3 transition "+(on?"border-current":"border-slate-200 hover:border-slate-300")}
                      style={on?{background:f.color+"15",borderColor:f.color,color:f.color}:{color:"#64748b"}}>
                        
                        <span className="text-[12px] font-medium">{f.name}</span>
                        {on&&<Icon name="Check" size={11} className="ml-auto"/>}
                      </button>
                    );
                  })}
                </div>
              </div>
              {/* 권한 등급 */}
              <div>
                <div className="text-[11px] font-medium text-slate-500 mb-1.5">권한 등급</div>
                <div className="grid grid-cols-3 gap-2">
                  {ROLES.map(r=>(
                    <button key={r} onClick={()=>setEditUser({...editUser,role:r})}
                      className={"h-10 rounded-lg border-2 text-[12.5px] font-semibold transition flex flex-col items-center justify-center gap-0.5 "+
                        (editUser.role===r?ROLE_COLOR[r]+" border-current":"border-slate-200 text-slate-600 hover:border-slate-300 hover:bg-slate-50")}>
                      {r==="Master"&&<Icon name="Crown" size={12}/>}
                      {r==="Admin"&&<Icon name="ShieldCheck" size={12}/>}
                      {r==="Engineer"&&<Icon name="Wrench" size={12}/>}
                      {r}
                    </button>
                  ))}
                </div>
                <div className="mt-2 text-[10.5px] text-slate-400 flex items-center gap-1"><Icon name="Info" size={10}/> Engineer &lt; Admin &lt; Master 순으로 권한이 높아집니다.</div>
              </div>
            </div>
            <div className="h-14 px-5 border-t border-slate-200 bg-slate-50/50 flex items-center gap-2">
              <button onClick={()=>setEditUser(null)} className="ml-auto h-9 px-3.5 rounded-md border border-slate-200 bg-white hover:bg-slate-50 text-[12.5px] font-medium text-slate-700">취소</button>
              <button onClick={()=>handleEditSave(editUser.id,editUser.role,editUser.fleets,editUser.dept)}
                disabled={editUser.fleets.length===0}
                className="h-9 px-4 rounded-md bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white text-[12.5px] font-medium flex items-center gap-1.5">
                <Icon name="Check" size={13}/> 저장
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Toast */}
      {toast&&(
        <div className={"fixed bottom-6 right-6 z-50 px-4 py-2.5 rounded-lg shadow-xl flex items-center gap-2.5 text-[12.5px] font-medium "+(toast.type==="error"?"bg-rose-600 text-white":toast.type==="warn"?"bg-amber-500 text-white":"bg-slate-900 text-white")}>
          <Icon name={toast.type==="error"?"AlertCircle":toast.type==="warn"?"AlertTriangle":"Check"} size={14}/>
          {toast.msg}
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════
   ROOT APP
══════════════════════════════════════════ */
function App() {
  useEffect(()=>{const el=document.createElement("style");el.textContent=CSS;document.head.appendChild(el);return()=>document.head.removeChild(el);},[]);
  const [active,setActive]=useState("home");
  const [cmdOpen,setCmdOpen]=useState(false);
  const [focusRcp,setFocusRcp]=useState(null);
  const [recipeRev,setRecipeRev]=useState(0);
  const [logsInitCat3,setLogsInitCat3]=useState(null);
  const [isDark,setIsDark]=useState(false);
  useEffect(()=>{ document.documentElement.classList.toggle("dm", isDark); },[isDark]); // logs 자동 선택용

  function navigate(id, opts={}){
    setActive(id);
    if(opts.logsCat3) setLogsInitCat3(opts.logsCat3);
  } // recipe 변경 감지용

  function saveRecipe(recipe) {
    const idx = recipes.findIndex(r=>r.id===recipe.id);
    if (idx>=0) recipes[idx] = recipe;
    else recipes.push(recipe);
    setRecipeRev(n=>n+1); // 전체 re-render 트리거
  }

  useEffect(()=>{
    const fn=e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();setCmdOpen(o=>!o);}else if(e.key==="Escape")setCmdOpen(false);};
    window.addEventListener("keydown",fn);return()=>window.removeEventListener("keydown",fn);
  },[]);

  function handleJump({view,payload}){
    if(view==="schedule"&&payload?.focusRecipeId){setFocusRcp(payload.focusRecipeId);setTimeout(()=>setFocusRcp(null),4500);}
    setActive(view);
  }
  const activeMeta = NAV_FLAT.find(n=>n.id===active);
  return (
    <div className="h-screen w-screen flex overflow-hidden bg-slate-50">
      <Sidebar active={active} onChange={setActive}/>
      <div className="flex-1 min-w-0 flex flex-col">
        <Header activeLabel={activeMeta?.label||""} onOpenCmd={()=>setCmdOpen(true)}/>
        <main className="flex-1 min-h-0">
          {active==="home"        &&<MonitoringHome onNavigate={navigate}/>}
          {active==="work"        &&<RecipeView onSaveRecipe={saveRecipe}/>}
          {active==="schedule"    &&<SchedulerView initialFocusRecipeId={focusRcp}/>}
          {active==="analytics"   &&<AnalyticsView/>}
          {active==="robot-status"&&<RobotStatusView/>}
          {active==="infra-status"&&<InfraStatusView/>}
          {active==="logs"        &&<LogsView initCat3={logsInitCat3} onMounted={()=>setLogsInitCat3(null)}/>}
          {active==="basis"       &&<BasisView/>}
          {active==="basis-robot" &&<BasisEmptyView label="로봇 관리"      icon="Bot"/>}
          {active==="basis-cart"  &&<ToolCartView/>}
          {active==="basis-infra" &&<BasisEmptyView label="인프라 관리"     icon="Server"/>}
          {active==="basis-alarm" &&<BasisEmptyView label="알람 관리"       icon="Bell"/>}
          {active==="permissions" &&<PermissionsView/>}
          {active==="map-editor"  &&<MapEditorView/>}
        </main>
      </div>
      <CommandPalette open={cmdOpen} onClose={()=>setCmdOpen(false)} onJump={handleJump}/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
